<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2440">
<title>Liftaro — Angebotsanfrage</title>
<link rel="icon" type="image/png" href="https://giltglobalinvest-pixel.github.io/angebotscheck_liftaro/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" defer></script>
<style>
  :root {
    --navy: #0e2440;
    --navy-2: #16345a;
    --purple: #7c3aed;
    --purple-deep: #5b21b6;
    --purple-soft: #f5f3ff;
    --teal: #0891b2;
    --teal-deep: #0e7490;
    --teal-soft: #ecfeff;
    --green: #16A34A;
    --green-soft: #DCFCE7;
    --amber: #D97706;
    --amber-soft: #FEF3C7;
    --red: #DC2626;
    --red-soft: #FEE2E2;
    --bg: #DDE7F0;
    --surface: #FFFFFF;
    --surface-alt: #F4F7FB;
    --ink: #0F1830;
    --ink-soft: #3D4A66;
    --ink-mute: #5C6E87;
    --ink-subtle: #94A3B8;
    --border: #E2E8F0;
    --border-strong: #CBD5E1;
    --r-sm: 7px;
    --r-md: 10px;
    --r-lg: 14px;
    --elev-1: 0 1px 2px rgba(15,24,48,.05), 0 2px 6px rgba(15,24,48,.06);
    --elev-2: 0 2px 6px rgba(15,24,48,.07), 0 8px 22px rgba(15,24,48,.10);
    --f-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
    --f-mono: 'DM Mono', 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--f-sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 18px 80px; }
  .topbar {
    background: var(--navy);
    color: #fff;
    padding: 14px 22px;
    border-radius: var(--r-md);
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--elev-1);
  }
  .topbar .brand { font-size: 16px; font-weight: 700; letter-spacing: .04em; }
  .topbar .tag { font-size: 11px; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: .08em; }
  .card { background: var(--surface); border-radius: var(--r-lg); padding: 22px 24px; margin-bottom: 14px; box-shadow: var(--elev-1); }
  .card h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; color: var(--ink); }
  .card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 700; color: var(--purple-deep); text-transform: uppercase; letter-spacing: .04em; }
  .label { font-size: 11px; font-weight: 700; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; display: block; }
  .muted { color: var(--ink-mute); font-size: 12.5px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
  .briefkopf { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 14px 16px; background: var(--surface-alt); border-radius: var(--r-md); margin-bottom: 14px; }
  .briefkopf .box { font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); }
  .briefkopf .box .tag { font-size: 10px; font-weight: 700; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .briefkopf .firma { font-weight: 700; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }
  .pos-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .pos-table th { background: var(--surface-alt); color: var(--ink-mute); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  .pos-row { border-bottom: 1px solid var(--border); }
  .pos-row td { padding: 12px 10px; vertical-align: top; }
  .pos-nr { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mute); width: 40px; }
  .pos-title { font-weight: 700; color: var(--ink); font-size: 14px; margin-bottom: 4px; }
  .pos-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; white-space: pre-line; }
  .pos-menge { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mute); white-space: nowrap; padding-top: 3px; }
  .pos-inputs { display: flex; gap: 8px; margin-top: 8px; }
  .pos-inputs .field { display: flex; flex-direction: column; }
  .pos-preis-wrap { width: 150px; }
  .field input, .field textarea { font-family: var(--f-sans); font-size: 13px; padding: 8px 11px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); outline: none; background: #fff; color: var(--ink); width: 100%; }
  .field input:focus, .field textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(124,58,237,.12); }
  .field .suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-mute); pointer-events: none; }
  .field-wrap { position: relative; }
  .bemerkung-row td { padding-top: 0; padding-bottom: 14px; }
  .bemerkung { width: 100%; }
  .bemerkung textarea { resize: vertical; min-height: 38px; font-size: 12.5px; line-height: 1.5; }
  .klauseln { background: var(--surface-alt); padding: 14px 18px; border-radius: var(--r-md); margin-top: 8px; font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); white-space: pre-line; }
  .klauseln.rich { white-space: normal; }
  .klauseln.rich h2, .klauseln.rich h3, .klauseln.rich h4, .klauseln.rich h5 { color: var(--ink); font-size: 13px; font-weight: 700; margin: 14px 0 4px; letter-spacing: .01em; }
  .klauseln.rich h2:first-child, .klauseln.rich h3:first-child, .klauseln.rich h4:first-child, .klauseln.rich h5:first-child { margin-top: 0; }
  .klauseln.rich p { margin: 0 0 8px; }
  .klauseln.rich p:last-child { margin-bottom: 0; }
  .klauseln.rich ul, .klauseln.rich ol { margin: 4px 0 10px; padding-left: 20px; }
  .klauseln.rich li { margin: 2px 0; }
  .klauseln.rich strong, .klauseln.rich b { color: var(--ink); }
  .klauseln.rich a { color: var(--purple-deep); }
  .sig-box { border: 2px dashed var(--border-strong); border-radius: var(--r-md); background: #fff; padding: 8px; }
  .sig-box canvas { width: 100%; height: 180px; touch-action: none; display: block; background: #fff; border-radius: var(--r-sm); }
  .sig-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .sig-clear { background: transparent; border: 1px solid var(--border-strong); color: var(--ink-mute); padding: 5px 11px; border-radius: var(--r-sm); font-size: 12px; cursor: pointer; font-family: inherit; }
  .sig-hint { font-size: 11.5px; color: var(--ink-mute); }
  .submit-bar { background: var(--surface); padding: 20px 24px; border-radius: var(--r-lg); box-shadow: var(--elev-2); display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .submit-bar .info { font-size: 12.5px; color: var(--ink-mute); flex: 1; min-width: 200px; }
  .btn-primary { background: linear-gradient(135deg, var(--purple), var(--purple-deep)); color: #fff; border: none; padding: 12px 28px; border-radius: var(--r-sm); font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(124,58,237,.3); transition: transform .12s, box-shadow .12s; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,58,237,.4); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
  .err-box { background: var(--red-soft); border: 1px solid var(--red); color: var(--red); padding: 14px 18px; border-radius: var(--r-md); font-size: 13.5px; line-height: 1.55; }
  .info-box { background: var(--amber-soft); border-left: 4px solid var(--amber); color: #78350f; padding: 12px 16px; border-radius: var(--r-sm); font-size: 12.5px; line-height: 1.55; margin-bottom: 14px; }
  .success-box { background: var(--green-soft); border: 1px solid var(--green); color: var(--green); padding: 22px 24px; border-radius: var(--r-md); text-align: center; }
  .success-box h2 { color: var(--green); margin: 0 0 6px; font-size: 18px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { font-size: 11px; color: var(--ink-mute); text-align: center; padding: 20px 0 6px; line-height: 1.6; }
  .footer code { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-subtle); }
  .summe-bar { background: var(--purple-soft); border: 1px solid #ddd6fe; padding: 12px 18px; border-radius: var(--r-md); margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
  .summe-bar .lbl { font-size: 11px; font-weight: 700; color: var(--purple-deep); text-transform: uppercase; letter-spacing: .05em; }
  .summe-bar .val { font-size: 18px; font-weight: 700; color: var(--purple-deep); font-family: var(--f-mono); }
  .lead-time-hint { background: var(--teal-soft); border-left: 3px solid var(--teal); padding: 10px 14px; border-radius: var(--r-sm); font-size: 12.5px; color: var(--teal-deep); margin: 10px 0 14px; }
</style>
</head>
<body>
<div id="root">
  <div class="wrap" style="text-align:center;padding-top:100px">
    <div class="spinner" style="width:34px;height:34px;border-width:3px"></div>
    <div class="muted" style="margin-top:16px">Lade Angebotsanfrage…</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ──────────────────────────────────────────────────────────────────────────
  // Config — Read-Key direkt (public OK), Submit via val.town-Proxy
  // ──────────────────────────────────────────────────────────────────────────
  const _k1 = 'patu8KWM';
  const _k2 = '8aWByxCGL';
  const _k3 = '.69fae5d9fa4b94c266b42';
  const _k4 = '6dadd71a51f574945d840b33569058ab5e9d89ebef3';
  const READ_KEY = _k1 + _k2 + _k3 + _k4;
  const BASE_ID  = 'apprX1EwclCYzR2bF';
  const MASTER_BASE_ID = 'appzhNrhkLSTEaNFW';
  const PROJECT_ID = 'p_1777239396379';
  const APP_VERSION = 'v1.14.1';

  // ──────────────────────────────────────────────────────────────────────────
  // Utils
  // ──────────────────────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // v1.4: Whitelist-basiertes Sanitizing für klauseln_html / einleitung_html
  // Erlaubt nur strukturelle Inline- und Block-Tags. Strip <script>, on-Handler, javascript:-URLs.
  function sanitizeHtml(html) {
    if (!html) return '';
    try {
      const tpl = document.createElement('template');
      tpl.innerHTML = String(html);
      const allowedTags = new Set(['p','br','h2','h3','h4','h5','strong','b','em','i','u','ul','ol','li','span','div','a','small']);
      const walk = (node) => {
        const kids = Array.from(node.childNodes);
        for (const c of kids) {
          if (c.nodeType === 1) {
            const tag = c.tagName.toLowerCase();
            if (!allowedTags.has(tag)) {
              // Tag verwerfen, Kinder aber behalten
              const parent = c.parentNode;
              while (c.firstChild) parent.insertBefore(c.firstChild, c);
              parent.removeChild(c);
              continue;
            }
            // Attribute strippen (außer href auf <a>)
            for (const attr of Array.from(c.attributes)) {
              const an = attr.name.toLowerCase();
              if (tag === 'a' && an === 'href') {
                const v = String(attr.value || '').trim();
                if (/^(https?:|mailto:|tel:)/i.test(v)) continue;
              }
              c.removeAttribute(attr.name);
            }
            if (tag === 'a') c.setAttribute('target', '_blank'), c.setAttribute('rel', 'noopener noreferrer');
            walk(c);
          } else if (c.nodeType === 8) {
            c.parentNode.removeChild(c); // Kommentare raus
          }
        }
      };
      walk(tpl.content);
      const tmp = document.createElement('div');
      tmp.appendChild(tpl.content);
      return tmp.innerHTML;
    } catch (e) {
      console.warn('sanitizeHtml fallback:', e);
      return esc(html);
    }
  }
  const fmtEur = (n) => {
    if (n == null || isNaN(n)) return '—';
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(n);
  };
  const getParam = (k) => new URLSearchParams(location.search).get(k);

  async function atRead(table, filter, baseId) {
    const base = baseId || BASE_ID;
    let url = 'https://api.airtable.com/v0/' + base + '/' + encodeURIComponent(table);
    if (filter) url += '?filterByFormula=' + encodeURIComponent(filter);
    const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + READ_KEY } });
    if (!r.ok) throw new Error('Airtable HTTP ' + r.status);
    const d = await r.json();
    return d.records || [];
  }

  function renderError(msg) {
    $('root').innerHTML = `
      <div class="wrap">
        <div class="topbar"><span class="brand">🛗 Liftaro</span><span class="tag">Angebotsanfrage</span></div>
        <div class="card"><div class="err-box"><strong>⚠ ${esc(msg)}</strong><br><span style="font-weight:400;font-size:12.5px;color:#7f1d1d">Bitte den Link in der Original-Email erneut anklicken oder den Absender kontaktieren.</span></div></div>
        <div class="footer">Liftaro GmbH · ${esc(APP_VERSION)}</div>
      </div>`;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Loader
  // ──────────────────────────────────────────────────────────────────────────
  async function load() {
    const token = getParam('t');
    if (!token) { renderError('Kein Token in der URL — Link unvollständig.'); return; }

    // 1) LV_Anfragen per Token finden
    let anfRecs;
    try {
      const filter = "{token}='" + token.replace(/'/g, "\\'") + "'";
      anfRecs = await atRead('LV_Anfragen', filter);
    } catch (e) {
      console.error('Anfrage-Lookup:', e);
      renderError('Verbindung zum Server fehlgeschlagen. Bitte später erneut versuchen.');
      return;
    }
    if (!anfRecs.length) { renderError('Angebotsanfrage nicht gefunden — Token ungültig oder die Anfrage wurde gelöscht.'); return; }
    const anfRec = anfRecs[0];
    const anf = { _recordId: anfRec.id, ...anfRec.fields };

    // 2) LV per id finden
    let lv = null;
    if (anf.lv_id) {
      try {
        const lvRecs = await atRead('Leistungsverzeichnisse', "{id}='" + String(anf.lv_id).replace(/'/g, "\\'") + "'");
        if (lvRecs.length) lv = { _recordId: lvRecs[0].id, ...lvRecs[0].fields };
      } catch (e) { console.warn('LV-Lookup:', e); }
    }
    // 3) Vorlage finden (für Klauseln + Einleitung)
    let vorlage = null;
    if (lv && lv.vorlage_id) {
      try {
        const vRecs = await atRead('LvVorlagen', "{id}='" + String(lv.vorlage_id).replace(/'/g, "\\'") + "'");
        if (vRecs.length) vorlage = vRecs[0].fields;
      } catch (e) { console.warn('Vorlage-Lookup:', e); }
    }

    // 4) Snapshots parsen
    let positionen = [];
    if (anf.positionen_snapshot_json) { try { positionen = JSON.parse(anf.positionen_snapshot_json); } catch(_) {} }
    if (!positionen.length && lv && lv.positionen_json) { try { positionen = JSON.parse(lv.positionen_json); } catch(_) {} }
    let snap = {};
    if (lv && lv.kontext_snapshot_json) { try { snap = JSON.parse(lv.kontext_snapshot_json); } catch(_) {} }
    let wn = {};
    if (anf.servicebetrieb_snapshot_json) { try { wn = JSON.parse(anf.servicebetrieb_snapshot_json); } catch(_) {} }

    // 5) Status — wenn bereits submitted: read-only success-view
    const status = String(anf.status || 'sent');
    // V12.446 (WV): Wartungsvertrag-Anfrage? (Objekt mit __wv im Anfrage-Snapshot, inkl. parties)
    let wvData = null;
    try { const _pj = JSON.parse(anf.positionen_snapshot_json || '{}'); if (_pj && _pj.__wv) wvData = _pj; } catch (_) {}
    if (wvData) {
      if (status === 'submitted') {
        let preisSub = Number(anf.summe_netto_eur) || 0;
        // v1.13.1: response_json ist jetzt ein Positions-Array ([{preis_eur}]); altes Objekt-Format {jahrespreis_netto} als Fallback
        try {
          const rj = JSON.parse(anf.response_json || 'null');
          if (Array.isArray(rj) && rj[0] && Number(rj[0].preis_eur)) preisSub = Number(rj[0].preis_eur);
          else if (rj && Number(rj.jahrespreis_netto)) preisSub = Number(rj.jahrespreis_netto);
        } catch (_) {}
        renderWvSubmittedView({ token, anf, lv, snap, wn, wv: wvData }, preisSub); return;
      }
      if (status !== 'opened') markAsOpened(token);
      renderWvForm({ token, anf, lv, snap, wn, wv: wvData }); return;
    }
    if (status === 'submitted') {
      renderSubmittedView(anf, lv, positionen, snap, wn);
      return;
    }

    // 6) Beim ersten Öffnen Status auf 'opened' setzen (fire-and-forget über Proxy)
    if (status !== 'opened') markAsOpened(token);

    // 7) Render Formular
    renderForm({ token, anf, lv, vorlage, positionen, snap, wn });
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Status: opened markieren (best-effort, fire-and-forget)
  // ──────────────────────────────────────────────────────────────────────────
  async function markAsOpened(token) {
    try {
      const base = await getPartnerApiUrl();
      if (!base) return;
      fetch(base + '/api/lv-anfragen/' + encodeURIComponent(token) + '/mark-opened', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
      }).catch(() => {});
    } catch (_) {}
  }

  // v1.7: Partner-API-URL (liftaroPartnerApi mit REST-Routes) statt Vorabcheck-Proxy
  let _cachedPartnerUrl = null;
  async function getPartnerApiUrl() {
    if (_cachedPartnerUrl !== null) return _cachedPartnerUrl;
    try {
      const filter = "AND({project_id}='" + PROJECT_ID + "',{key_name}='partnerApiUrl')";
      const recs = await atRead('Keys', filter, MASTER_BASE_ID);
      const v = recs[0] && recs[0].fields && recs[0].fields.key_value;
      _cachedPartnerUrl = v ? String(v).trim().replace(/\/+$/, '') : '';
      if (!_cachedPartnerUrl) console.warn('[lv-anfrage] partnerApiUrl in Master-Base/Keys nicht gefunden');
    } catch (e) {
      console.error('[lv-anfrage] getPartnerApiUrl failed:', e);
      _cachedPartnerUrl = '';
    }
    return _cachedPartnerUrl;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Form-Render
  // ──────────────────────────────────────────────────────────────────────────
  function renderForm(ctx) {
    const { anf, lv, vorlage, positionen, snap, wn } = ctx;
    const hvName  = snap.hv_name || '(Hausverwaltung)';
    const hvEmail = snap.hv_email || '';
    const standort = snap.standort || '';
    const fn      = snap.fabriknummer || '';
    const hersteller = snap.hersteller || '';
    const lvTitel = lv && lv.titel || ('LV ' + (fn ? '· Fn ' + fn : ''));
    // v1.5: Snapshot bevorzugen (eingefroren beim Versand), Fallback auf Live-Vorlage
    const klauseln         = String(anf.klauseln_snapshot_html   || (vorlage && vorlage.klauseln_html)    || '');
    const einleitung       = String(anf.einleitung_snapshot_html || (vorlage && vorlage.einleitung_html)  || '');
    const unterschriftText = String(anf.unterschrift_snapshot    || (vorlage && vorlage.unterschrift_text) || 'Mit der Unterzeichnung dieses Leistungsverzeichnisses gebe ich ein verbindliches Angebot ab. Die genannten Preise sind exkl. MwSt.');

    // V12.460: Modernisierung Gesamtpreis-Variante — Bausteine read-only, EIN Gesamtpreis statt Einzelpreisen.
    const isGesamt = String((lv && lv.vorlage_id) || '') === 'lvv_modernisierung_gesamt_default';
    ctx.isGesamt = isGesamt;
    // V12.463 / v1.13.4: Modernisierung (beide Varianten) → eigene Termin-Felder (Stillstand + Lieferzeit).
    const isMod = String((lv && lv.vorlage_id) || '').indexOf('lvv_modernisierung') === 0;
    ctx.isMod = isMod;
    const positionenHtml = positionen.map((p, idx) => {
      const nr = String(p.pos_nr || (idx + 1));
      const titel = String(p.titel || '').trim();
      const desc = String(p.beschreibung || '').trim();
      const menge = String(p.menge || '1');
      const einheit = String(p.einheit || 'Pauschal');
      if (isGesamt) {
        return `
        <tr class="pos-row" data-idx="${idx}">
          <td class="pos-nr">${esc(nr)}.</td>
          <td><div class="pos-title">${esc(titel || '(Position)')}</div>${desc ? `<div class="pos-desc">${esc(desc)}</div>` : ''}</td>
          <td class="pos-menge">${esc(menge)}<br><span style="color:#94a3b8">${esc(einheit)}</span></td>
        </tr>`;
      }
      // v1.2: Wunschpreis = Original × 0.7 (wenn vorhanden)

    $('root').innerHTML = `

              <input type="checkbox" id="sigConfirm" style="margin-top:3px;width:18px;height:18px;cursor:pointer;accent-color:var(--purple)">
              <span style="font-size:13px;color:var(--ink);line-height:1.55"><strong>Hiermit gebe ich mein Angebot zu den vorstehenden Preisen und Konditionen verbindlich ab.</strong> Ich bestätige rechtsverbindlich, im Namen meines Unternehmens zur Abgabe dieses Angebots befugt zu sein.</span>
            </label>
            <div class="muted" style="font-size:11.5px;margin-top:10px;line-height:1.5">Diese digitale Bestätigung gilt rechtlich gleichwertig zur handschriftlichen Unterschrift (§ 127 BGB i. V. m. § 126b BGB · Textform).</div>
          </div>

          <div id="sigModeDrawn" style="display:none">
            <div class="sig-box">
              <canvas id="sigCanvas" width="800" height="180"></canvas>

              <span class="sig-hint">Unterschreiben Sie oben mit Maus oder Finger</span>
              <div style="display:flex;gap:6px">
                <button type="button" class="sig-clear" onclick="window._lvAutoSig&&window._lvAutoSig()" style="background:var(--purple-soft);border-color:#c4b5fd;color:var(--purple-deep);font-weight:700">✍ Auto-Generieren</button>
                <button type="button" class="sig-clear" onclick="window._lvClearSig&&window._lvClearSig()">↻ Löschen</button>
              </div>

          <div style="margin-top:14px">
            <label class="label">Name des Unterzeichners *</label>
            <div class="field"><input type="text" id="sigName" placeholder="Vor- und Nachname" value="${esc(wn.ansprechperson || '')}"></div>
          </div>
        </div>

        <div class="submit-bar">
          <div class="info">Mit Klick auf „Angebot absenden" wird Ihr Angebot verbindlich an die Liftaro-Plattform übertragen und die Hausverwaltung informiert.</div>
          <button class="btn-primary" id="submitBtn" onclick="window._lvSubmit&&window._lvSubmit()">📤 Angebot absenden</button>
        </div>

        <div class="footer">
          <code>Token: ${esc(getParam('t').slice(0, 10))}…</code> · Liftaro GmbH · ${esc(APP_VERSION)}<br>
          Bei Fragen: <a href="mailto:check@liftaro.de" style="color:var(--purple-deep)">check@liftaro.de</a>
        </div>
      </div>
    `;

    initSignaturePad();
    window._lvCtx = ctx;
    window._lvSubmit = doSubmit;
    window._lvRecalcSumme = recalcSumme;
    // v1.3: Tab-State (Default = digital)
    window._lvSigMode = 'digital';
    window._lvSwitchSigMode = switchSigMode;
    recalcSumme();
  }

  function switchSigMode(mode) {
    window._lvSigMode = mode;
    const tabD = $('sigTabDigital'), tabZ = $('sigTabDrawn');
    const paneD = $('sigModeDigital'), paneZ = $('sigModeDrawn');
    if (!tabD || !tabZ || !paneD || !paneZ) return;
    const active = 'background:var(--surface);color:var(--ink);font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;box-shadow:var(--elev-1)';
    const inactive = 'background:transparent;color:var(--ink-mute);font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit';
    const base = 'flex:1;padding:8px 12px;border:none;border-radius:5px;';
    if (mode === 'drawn') {
      tabD.style.cssText = base + inactive;
      tabZ.style.cssText = base + active;
      paneD.style.display = 'none';
      paneZ.style.display = 'block';
    } else {
      tabD.style.cssText = base + active;
      tabZ.style.cssText = base + inactive;
      paneD.style.display = 'block';
      paneZ.style.display = 'none';
    }
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Summe-Berechnung
  // ──────────────────────────────────────────────────────────────────────────
  function parseEur(s) {
    if (!s) return 0;
    const cleaned = String(s).replace(/[€\s]/g, '').replace(/\./g, '').replace(',', '.');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }
  function recalcSumme() {
    const ctx = window._lvCtx;
    if (!ctx) return;
    let sum = 0;
    ctx.positionen.forEach((p, idx) => {
      const eur = parseEur($('preis_' + idx)?.value);
      const menge = parseFloat(String(p.menge || '1').replace(',', '.')) || 1;
      sum += eur * menge;
    });
    const el = $('summeAnzeige');
    if (el) el.textContent = sum > 0 ? fmtEur(sum) : '— €';
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Signature Pad (Vanilla Canvas — Pointer Events)
  // ──────────────────────────────────────────────────────────────────────────
  function initSignaturePad() {
    const canvas = $('sigCanvas');
    if (!canvas) return;
    // Hi-DPI
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = 180 * ratio;
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#0f172a';
    let drawing = false, last = null, hasDrawn = false;
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - r.left;
      const y = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - r.top;
      return { x, y };
    }
    function start(e) { e.preventDefault(); drawing = true; last = pos(e); }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      hasDrawn = true;
    }
    function end(e) { drawing = false; last = null; }
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointerleave', end);
    canvas.addEventListener('pointercancel', end);
    window._lvClearSig = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); hasDrawn = false; };
    window._lvSigHasDrawn = () => hasDrawn;
    // v1.10: Auto-Signatur per Klick — nimmt sigName und zeichnet sie in Schreibschrift
    window._lvAutoSig = () => {
      const name = ($('sigName')?.value || '').trim();
      if (!name) { alert('Bitte zuerst den Namen des Unterzeichners eintragen.'); $('sigName')?.focus(); return; }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Canvas-Inneres-Display-Size
      const dispW = canvas.width / ratio;
      const dispH = canvas.height / ratio;
      ctx.save();
      // Versuche eine echte Schreibschrift-Font (Browser-fallback)
      const fontSize = Math.min(56, Math.floor(dispH * 0.42));
      ctx.font = 'italic ' + fontSize + 'px "Brush Script MT","Lucida Handwriting","Snell Roundhand",cursive,serif';
      ctx.fillStyle = '#0f172a';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      // Leichte Rotation für Handschrift-Effekt
      ctx.translate(40, dispH / 2 + 4);
      ctx.rotate(-0.04);
      ctx.fillText(name, 0, 0);
      // Subtle Schwung-Linie unter dem Namen
      const w = ctx.measureText(name).width;
      ctx.strokeStyle = 'rgba(15,23,42,.55)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-6, fontSize * 0.42);
      ctx.bezierCurveTo(w * 0.3, fontSize * 0.52, w * 0.7, fontSize * 0.42, w + 18, fontSize * 0.32);
      ctx.stroke();
      ctx.restore();
      hasDrawn = true;
    };
    window._lvSigDataUrl = () => {
      // Re-render auf weißem Hintergrund
      const out = document.createElement('canvas');
      out.width = canvas.width;
      out.height = canvas.height;
      const ox = out.getContext('2d');
      ox.fillStyle = '#fff';
      ox.fillRect(0, 0, out.width, out.height);
      ox.drawImage(canvas, 0, 0);
      return out.toDataURL('image/png');
    };
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Submit
  // ──────────────────────────────────────────────────────────────────────────
  async function doSubmit() {
    const ctx = window._lvCtx;
    if (!ctx) return;
    const btn = $('submitBtn');
    const setBusy = (txt) => { if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,.3)"></span> ' + txt; } };
    const resetBtn = () => { if (btn) { btn.disabled = false; btn.textContent = '📤 Angebot absenden'; } };

    // Validierung
    // V12.464 / v1.13.5: Modernisierung — zwei Termin-Felder (Stillstand + Lieferzeit) → in lieferzeit_gesamt kombiniert (kein Schema-/Val-Change).
    let lieferzeitGesamt;
    if (ctx.isMod) {
      const _st = String($('stillstandMod')?.value || '').trim();
      const _lz = String($('lieferzeitMod')?.value || '').trim();
      const _parts = [];
      if (_st) _parts.push('Stillstand: ' + _st);
      if (_lz) _parts.push('Lieferzeit: ' + _lz);
      lieferzeitGesamt = _parts.join(' · ');
    } else {
      lieferzeitGesamt = String($('lieferzeitGesamt')?.value || '').trim();
    }
    let response;
    if (ctx.isGesamt) {
      // V12.460: Gesamtpreis-Variante — EIN Pauschalpreis für den gesamten Leistungsumfang.
      // response_json bleibt ein 1-Element-Array (kompatibel mit Val + Ergebnis-Check).
      const gesamt = parseEur($('gesamtPreis')?.value);
      if (!gesamt || gesamt <= 0) { alert('Bitte einen Netto-Gesamtpreis eintragen.'); $('gesamtPreis')?.focus(); return; }
      response = [{
        pos_nr: '1',
        titel: 'Modernisierung — Gesamtpreis (Pauschalangebot)',
        menge: '1',
        einheit: 'Pauschal',
        beschreibung: 'Netto-Gesamtpreis (Pauschale) für den gesamten Leistungsumfang gemäß Leistungsverzeichnis (' + ctx.positionen.length + ' Bausteine).',
        preis_eur: gesamt,
        bemerkung: '',
      }];
    } else {
      response = ctx.positionen.map((p, idx) => ({
        pos_nr:     String(p.pos_nr || (idx + 1)),
        titel:      String(p.titel || ''),
        menge:      String(p.menge || '1'),
        einheit:    String(p.einheit || 'Pauschal'),
        beschreibung: String(p.beschreibung || ''),
        preis_eur:  parseEur($('preis_' + idx)?.value),
        bemerkung:  String($('bemerkung_' + idx)?.value || '').trim(),
      }));
      const leerePos = response.filter(r => !r.preis_eur || r.preis_eur <= 0);
      if (leerePos.length === response.length) {
        alert('Bitte mindestens einen Preis eintragen.');
        return;
      }
      if (leerePos.length) {
        const ok = confirm('⚠ ' + leerePos.length + ' Position' + (leerePos.length === 1 ? '' : 'en') + ' ohne Preis (' + leerePos.map(r => r.pos_nr).join(', ') + ').\n\nTrotzdem absenden?');
        if (!ok) return;
      }
    }
    const sigName = $('sigName')?.value.trim() || '';
    if (!sigName) { alert('Bitte den Namen des Unterzeichners eintragen.'); $('sigName')?.focus(); return; }
    // v1.3: zwei Modi — digital (Checkbox) oder gezeichnet (Canvas)
    const sigMode = String(window._lvSigMode || 'digital');
    let signaturDataUrl = '';
    let bestaetigungText = '';
    if (sigMode === 'drawn') {
      if (typeof window._lvSigHasDrawn !== 'function' || !window._lvSigHasDrawn()) {
        alert('Bitte unterschreiben Sie oben mit Maus oder Finger — oder wechseln Sie zu „✓ Digital bestätigen".');
        return;
      }
      signaturDataUrl = (typeof window._lvSigDataUrl === 'function') ? window._lvSigDataUrl() : '';
    } else {
      const cb = $('sigConfirm');
      if (!cb || !cb.checked) {
        alert('Bitte die Bestätigungs-Checkbox aktivieren — oder wechseln Sie zu „✍ Unterschrift zeichnen".');
        cb?.focus();
        return;
      }
      bestaetigungText = 'Hiermit gebe ich mein Angebot zu den vorstehenden Preisen und Konditionen verbindlich ab. Ich bestätige rechtsverbindlich, im Namen meines Unternehmens zur Abgabe dieses Angebots befugt zu sein.';
    }

    // v1.7: Submit via Partner-API REST (POST /api/lv-anfragen/:token/submit)
    setBusy('Sende …');
    const base = await getPartnerApiUrl();
    if (!base) {
      resetBtn();
      alert('Konfigurationsfehler: kein Submit-Endpoint vorhanden. Bitte den Absender kontaktieren.');
      return;
    }
    const sum = response.reduce((acc, r) => {
      const menge = parseFloat(String(r.menge).replace(',', '.')) || 1;
      return acc + (r.preis_eur * menge);
    }, 0);
    const payload = {
      response_json: JSON.stringify(response),
      signatur_dataurl: signaturDataUrl,
      signatur_name: sigName,
      signatur_methode: sigMode,
      bestaetigung_text: bestaetigungText,
      summe_netto_eur: Math.round(sum * 100) / 100,
      lieferzeit_gesamt: lieferzeitGesamt,
    };
    try {
      const r = await fetch(base + '/api/lv-anfragen/' + encodeURIComponent(ctx.token) + '/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error) throw new Error(String(j.error || ('HTTP ' + r.status)));
      // v1.8: nach erfolgreichem Submit den vollständigen State für PDF-Download bereithalten
      window._lvSubmission = {
        anf: ctx.anf, lv: ctx.lv, vorlage: ctx.vorlage, snap: ctx.snap, wn: ctx.wn,
        response, sum,
        sigMode, sigName, signaturDataUrl,
        lieferzeitGesamt,
        klauseln: String(ctx.anf.klauseln_snapshot_html || (ctx.vorlage && ctx.vorlage.klauseln_html) || ''),
      };
      renderSubmittedView(ctx.anf, ctx.lv, response, ctx.snap, ctx.wn, sum);
    } catch (e) {
      console.error('Submit:', e);
      resetBtn();
      alert('Übermittlung fehlgeschlagen: ' + e.message + '\n\nBitte erneut versuchen oder den Absender per Email informieren.');
    }
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Submitted-View
  // ──────────────────────────────────────────────────────────────────────────
  function renderSubmittedView(anf, lv, positionen, snap, wn, sum) {
    const lvTitel = (lv && lv.titel) || 'LV';
    const datum = anf.submitted_at ? new Date(anf.submitted_at).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : 'Soeben';
    const summe = sum != null ? fmtEur(sum) : '—';
    const hasSubmission = !!window._lvSubmission;
    $('root').innerHTML = `

  // ──────────────────────────────────────────────────────────────────────────
  // v1.8: PDF-Generator (pdf-lib clientseitig)
  // ──────────────────────────────────────────────────────────────────────────
  async function downloadAngebotPdf() {
    const sub = window._lvSubmission;
    const btn = $('dlPdfBtn');
    if (!sub) { alert('Keine Daten für PDF — bitte Seite neu laden.'); return; }
    if (!window.PDFLib) { alert('PDF-Bibliothek noch nicht geladen — bitte 2 Sek warten.'); return; }
    if (btn) { btn.disabled = true; btn.textContent = '⏳ PDF wird erstellt …'; }
    try {
      const blob = await buildAngebotPdf(sub);
      const fn = 'Angebot_' + (sub.snap.fabriknummer || sub.anf.id || 'LV').replace(/[^A-Za-z0-9_-]+/g, '_') + '.pdf';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fn;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      console.error('PDF-Build:', e);
      alert('PDF-Erstellung fehlgeschlagen: ' + (e.message || e));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '📄 Angebot als PDF herunterladen'; }
    }
  }

  // Striped HTML → plain text (für AGB-Klauseln im PDF)
  function htmlToText(html) {
    if (!html) return '';
    const tmp = document.createElement('div');
    tmp.innerHTML = String(html);
    // Block-Tags zu \n umsetzen
    tmp.querySelectorAll('h1,h2,h3,h4,h5,p,li,br,div').forEach(el => {
      if (el.tagName === 'BR') el.replaceWith('\n');
      else el.insertAdjacentText('beforeend', '\n');
    });
    return (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  }

// ════════ V12.446: Wartungsvertrag-Engine (Port aus index.html) ════════
function _winAnsiSafe(s) {
  if (s == null) return '';
  const conf = {
    // Kyrillisch confusables (Kleinbuchstaben)
    'а':'a','е':'e','о':'o','с':'c','р':'p','х':'x','у':'y','к':'k','т':'t','м':'m','н':'h','в':'B','і':'i','ӏ':'l','ѕ':'s','ј':'j','ԛ':'q','ԝ':'w',
    // Kyrillisch confusables (Großbuchstaben)
    'А':'A','Е':'E','О':'O','С':'C','Р':'P','Х':'X','У':'Y','К':'K','Т':'T','М':'M','Н':'H','В':'B','І':'I','Ѕ':'S','Ј':'J',
    // Griechisch confusables
    'α':'a','ο':'o','ε':'e','ρ':'p','τ':'t','κ':'k','ν':'v','ι':'i','μ':'u',
    'Α':'A','Β':'B','Ε':'E','Η':'H','Ι':'I','Κ':'K','Μ':'M','Ν':'N','Ο':'O','Ρ':'P','Τ':'T','Υ':'Y','Χ':'X','Ζ':'Z',
    // Smart Quotes / Dashes
    '‘':"'", '’':"'", '‚':',', '‛':"'",
    '“':'"', '”':'"', '„':'"', '‟':'"',
    '–':'-', '—':'-', '−':'-', '‒':'-', '―':'-',
    '…':'...',
    // Whitespace varianten → normales Space
    ' ':' ', ' ':' ', ' ':' ', ' ':' ', ' ':' ', ' ':' ',
    // Zero-width drop
    '​':'', '‌':'', '‍':'', '﻿':'',
  };
  let out = '';
  for (const ch of String(s)) {
    if (Object.prototype.hasOwnProperty.call(conf, ch)) { out += conf[ch]; continue; }
    const code = ch.charCodeAt(0);
    // ASCII printable + Tab/LF/CR
    if (code === 0x09 || code === 0x0A || code === 0x0D) { out += ch; continue; }
    if (code >= 0x20 && code <= 0x7E) { out += ch; continue; }
    // Latin-1 Supplement (deckt äöüß, € ist 0x20AC = separate WinAnsi-Slot)
    if (code >= 0xA0 && code <= 0xFF) { out += ch; continue; }
    // € ist in WinAnsi an 0x80 — separat zulassen
    if (code === 0x20AC) { out += ch; continue; }
    // Alles übrige durch Fragezeichen ersetzen
    out += '?';
  }
  return out;
}

function _eiWvNextPossibleStart(startISO, laufzeitJahre, kuendMonate) {
  try {
    const start = new Date(String(startISO).slice(0, 10) + 'T00:00:00');
    if (isNaN(start.getTime())) return '';
    const lf = Math.max(1, parseInt(laufzeitJahre, 10) || 1);
    const km = Math.max(0, parseInt(kuendMonate, 10) || 0);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    let end = new Date(start); end.setFullYear(end.getFullYear() + lf);
    let guard = 0;
    while (guard < 240) {
      const deadline = new Date(end); deadline.setMonth(deadline.getMonth() - km);
      if (deadline >= today) break;

      guard++;

    const pad = (n) => (n < 10 ? '0' + n : String(n));

    ['Vertragslaufzeit', (o.laufzeit_jahre ? o.laufzeit_jahre + ' Jahre' : '–')],
    ['Jahrespreis (netto)', _eiWvFmtEur(o.jahrespreis_netto)],
    ['Abrechnungsturnus', _eiWvTurnusLabel(o.abrechnung_turnus)],
  ];
  let md = '## Leistungsübersicht\n\n| Leistung | Vereinbart |\n| --- | --- |\n';
  rows.forEach(r => { md += '| ' + r[0] + ' | ' + r[1] + ' |\n'; });
  return md;
}

// {{#flag}}…{{/flag}} (positiv) und {{^flag}}…{{/flag}} (negativ); Nesting via Mehrfach-Pässe.
function _eiWvApplyConditionals(tpl, flags) {
  let out = String(tpl || ''), prev, guard = 0;
  do {
    prev = out;
    out = out.replace(/\{\{#(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (m, k, body) => flags[k] ? body : '');
    out = out.replace(/\{\{\^(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (m, k, body) => flags[k] ? '' : body);
    guard++;
  } while (out !== prev && guard < 12);
  return out;
}

// §-Unterabschnitte (### N.M …) nach dem Ausblenden lückenlos neu nummerieren.
// Major-Nummern (## § N) bleiben unverändert (sind nicht bedingt).
function _eiWvRenumber(md) {
  let major = 0, minor = 0;
  return String(md || '').split('\n').map(line => {
    const maj = line.match(/^##\s+§\s+(\d+)\b/);
    if (maj) { major = parseInt(maj[1], 10); minor = 0; return line; }
    const sub = line.match(/^###\s+\d+\.(\d+)(.*)$/);
    if (sub && major) { minor++; return '### ' + major + '.' + minor + sub[2]; }
    return line;
  }).join('\n');
}

// vertrag_titel, vertragsnummer, datum_heute (in Phase 1 ggf. Beispielwerte).

  };
  const jahres = Number(o.jahrespreis_netto) || 0;
  const turnusBetrag = o.abrechnung_turnus === 'quartalsweise' ? jahres / 4 : jahres;
  const data = {
    vertrag_titel:      p.vertrag_titel   || 'Wartungsvertrag',

    firma_adresse:      [String(p.firma_strasse||'').trim(), [String(p.firma_plz||'').trim(), String(p.firma_ort||'').trim()].filter(Boolean).join(' ')].filter(Boolean).join('\n'),
    vertrag_uebersicht: _eiWvBuildUebersicht(o),
    aufzug_anzahl:      String(p.aufzug_anzahl || 1),
    aufzug_liste:       p.aufzug_liste    || '—',
    wartungen_pro_jahr: String(o.wartungen_pro_jahr || '—'),

    abrechnung_turnus:  _eiWvTurnusLabel(o.abrechnung_turnus),

    start_datum:        _eiWvFmtDate(o.vertragsbeginn),
    laufzeit_monate:    String((Number(o.laufzeit_jahre) || 0) * 12),
  };
  let md = String(templateMd || _eiWvVertragTemplateMd());
  md = _eiWvApplyConditionals(md, flags);
  md = md.replace(/\{\{(\w+)\}\}/g, (m, k) => (data[k] != null ? String(data[k]) : ''));
  md = _eiWvRenumber(md);
  // Mehrfach-Leerzeilen (durch ausgeblendete Blöcke) zusammenfassen
  md = md.replace(/\n{3,}/g, '\n\n').trim() + '\n';

## § 3 Wartungsleistungen

### 3.1 Regelmäßige Wartung

Der AN führt an den vertragsgegenständlichen Anlagen {{wartungen_pro_jahr}} Wartungseinsätze pro Jahr durch.

{{#vollwartung}}Es wird eine **Vollwartung** vereinbart: Übliche Verschleißteile sowie deren Austausch sind im Vergütungsumfang enthalten, soweit nicht unter § 3 ausdrücklich ausgenommen.{{/vollwartung}}{{#systemwartung}}Es wird eine **Systemwartung** vereinbart: Gegenstand ist die Wartung; Reparaturen, Ersatzteile und Verschleißteile werden gesondert nach Aufwand berechnet (vgl. nicht enthaltene Leistungen).{{/systemwartung}}

Die Wartungsarbeiten umfassen insbesondere:

- Sicht-, Funktions- und Sicherheitsprüfungen aller sicherheitsrelevanten Baugruppen und Komponenten
- Schmieren, Einstellen und Nachstellen von Bauteilen gemäß den Herstellervorgaben und technischen Regelwerken
- Reinigung der Anlage im unmittelbaren Wartungsbereich
- Dokumentation der durchgeführten Arbeiten in einem Wartungsnachweis
- Verbrauchsmaterialien (Schmierstoffe, Reinigungsmittel) sowie die Entsorgung der im Rahmen der Wartung ausgetauschten Kleinteile sind in der Vergütung enthalten

Die Wartungseinsätze werden während der Regelarbeitszeit des AN (Montag bis Freitag, 07:00–17:00 Uhr, ausgenommen gesetzliche Feiertage) durchgeführt.

### 3.2 Störungsbeseitigung

Der AN nimmt Störungsmeldungen über ein Service-Center entgegen. Die Erreichbarkeit des Service-Centers ist rund um die Uhr, 365 Tage im Jahr, gewährleistet.

Störungsbeseitigungen werden innerhalb der Regelarbeitszeit des AN ausgeführt. Die Reaktionszeit beträgt innerhalb der Regelarbeitszeit bis zu 24 Stunden ab Eingang der Störungsmeldung.

Einsätze außerhalb der Regelarbeitszeit werden auf ausdrücklichen Wunsch des AG erbracht. Die dabei anfallenden Überstundenzuschläge und etwaige Notdienstpauschalen werden dem AG gesondert in Rechnung gestellt.

{{#notruf}}### 3.3 Notruf- und Notbefreiungsservice

Der AN stellt dem AG für die Dauer des Vertragsverhältnisses leihweise ein Notrufgerät inkl. GSM-Modul zur Verfügung, sofern nicht schriftlich etwas anderes vereinbart ist. Das Notrufgerät wird auf eine rund um die Uhr besetzte Servicezentrale des AN aufgeschaltet. Eingehende Notrufe werden entgegengenommen und die Befreiung eingeschlossener Personen durch qualifiziertes Fachpersonal koordiniert und durchgeführt.

Damit erfüllt der AG die Anforderungen der BetrSichV Anhang 1 Abschnitt 4.1 hinsichtlich Notrufbereitschaft und Personenbefreiung. Die für den Betrieb des GSM-Moduls anfallenden Verbindungskosten (Flatrate) sind in der vereinbarten Vergütung enthalten.

{{#notruf_montage}}Die Montage des Notrufgeräts ist in der vereinbarten Vergütung enthalten.{{/notruf_montage}}{{^notruf_montage}}Die Montage des Notrufgeräts wird gesondert nach Aufwand berechnet.{{/notruf_montage}}

Der AG hat sicherzustellen, dass im Bereich des Aufzugsschachts und des Maschinenraums eine ausreichende Mobilfunkversorgung besteht. Ist dies nicht der Fall, schlägt der AN geeignete Maßnahmen zur Verbesserung der Empfangsqualität vor; die entstehenden Kosten trägt der AG.

Zur Aufbewahrung der für die Notbefreiung notwendigen Objektschlüssel wird ein Schlüsselbehälter in der jeweiligen Liegenschaft installiert. Der AN wählt den geeigneten Standort in Abstimmung mit dem AG. Die Einlagerung der Schlüssel erfolgt auf Risiko des AG.

{{/notruf}}{{#zues}}### 3.4 Wiederkehrende Prüfungen (ZÜS-Koordination)

Der AN übernimmt im Auftrag des AG die Organisation, Koordination und Begleitung der gesetzlich vorgeschriebenen wiederkehrenden Prüfungen (Haupt- und Zwischenprüfungen) durch eine zugelassene Überwachungsstelle (ZÜS). Hierzu gehören:

- Beauftragung einer vom AN ausgewählten ZÜS
- Terminverfolgung und Terminmitteilung an den AG
- Begleitung der Hauptprüfungen durch einen Servicetechniker des AN
- Hinterlegung und Auswertung der Prüfberichte
- Angebotserstellung zur Beseitigung festgestellter Mängel auf Anfrage
- Mängelabmeldung bei der ZÜS (sofern die Mängelbeseitigung durch den AN erfolgt)

Nicht enthalten sind: Kosten für Nachprüfungen, sofern deren Ursache nicht beim AN liegt; Kosten für Prüfungen nach Änderungen oder Modernisierungen; Kosten für Prüfgewichte.

Der AG bevollmächtigt den AN hiermit, die für die Durchführung der Prüfungen erforderlichen Informationen und Unterlagen bei bisherigen Vertragspartnern oder Behörden einzuholen sowie die ZÜS im Namen des AG zu beauftragen.

Sofern bei Vertragsbeginn wiederkehrende Prüfungen bereits überfällig sind, beauftragt der AN die entsprechenden Nachprüfungen; diese sind nicht im Vertragspreis enthalten und werden gesondert in Rechnung gestellt.

{{/zues}}### 3.5 Nicht enthaltene Leistungen

Sofern in diesem Vertrag nichts anderes vereinbart ist, sind folgende Leistungen nicht Bestandteil der vereinbarten Vergütung und werden gesondert abgerechnet:

- Reparatur und Austausch von Beleuchtungsmitteln und Batterien (ausgenommen Notrufakku)
- Nachfüllen und Wechseln von Getriebeöl sowie Altölentsorgung
- Reparatur- und Austauscharbeiten, die auf Ereignisse außerhalb des Einflussbereichs des AN zurückzuführen sind (insbesondere Vandalismus, Missbrauch, Wasserschäden, Überspannung, höhere Gewalt)
- Arbeiten aufgrund neuer oder geänderter gesetzlicher Anforderungen, die nach Vertragsabschluss in Kraft treten
- Reparatur oder Austausch von Fahrkorb, Schachtgehäuse, Türverkleidungen, Türrahmen und dekorativen Bauteilen
- Austausch von Maschinen, Antrieben, Steuerungen, Tragseilen sowie bei Hydraulikanlagen von Zylindern und Kolben
- Reinigung des Gebäudes und der Kabine über den wartungsbedingten Bereich hinaus
- Wartung und Reparatur der gebäudeseitigen Netzwerkinfrastruktur (LAN)
- Mündlich erteilte Reparaturaufträge dürfen bis zu einem Wert von 500,00 € netto vom AN sofort ausgeführt und dem AG in Rechnung gestellt werden

## § 4 Vergütung und Zahlungsbedingungen

### 4.1 Vergütung

Der AG zahlt an den AN für die vertraglich vereinbarten Leistungen gemäß § 3 eine jährliche Nettovergütung in Höhe von:

**{{jahresumsatz}} (netto, zzgl. der gesetzlichen Mehrwertsteuer)**

Abrechnungsart: {{abrechnung_typ}}
Abrechnungsturnus: {{abrechnung_turnus}}
Betrag je Abrechnungsperiode: **{{turnus_betrag}} (netto, zzgl. der gesetzlichen Mehrwertsteuer)**

### 4.2 Sondereinsätze und Zusatzleistungen

Über die vereinbarte Pauschale hinausgehende Leistungen (vgl. § 3, nicht enthaltene Leistungen) sowie Einsätze außerhalb der Regelarbeitszeit erfolgen nur auf gesonderte Beauftragung. Abgerechnet wird zum jeweils bei Beauftragung gültigen Stundensatz; die aktuelle Preisliste wird auf Anfrage mitgeteilt. Fahrtkosten, Materialkosten und etwaige Fremdkosten werden gesondert berechnet.

### 4.3 Fälligkeit und Zahlungsverzug

Rechnungen sind innerhalb von 14 Tagen nach Rechnungseingang ohne Abzug zur Zahlung fällig. Bei Zahlungsverzug ist der AN berechtigt, Verzugszinsen in Höhe von 5 Prozentpunkten über dem jeweiligen Basiszinssatz gemäß § 247 BGB zu berechnen. Darüber hinaus ist der AN berechtigt, die Erbringung der Leistungen bis zur vollständigen Begleichung aller rückständigen Beträge auszusetzen.

### 4.4 Preisanpassung

Der AN ist berechtigt, die vereinbarte Vergütung jeweils zum 1. Januar eines Kalenderjahres anzupassen. Die Preisanpassung erfolgt auf Grundlage der nachstehenden Formel:

**KN = K × (PM × MN/M + PL × LN/L)**

Dabei gilt:
- **KN** = neuer Vertragspreis
- **K** = zuletzt gültiger Vertragspreis
- **PM** = materialabhängiger Preisanteil: 20 %
- **PL** = entgeltabhängiger Preisanteil: 80 %
- **M** = Erzeugerpreisindex (Personen- und Lastenaufzüge, Rolltreppen, Rollsteige, GP19-282216) im zuletzt gültigen Vertragspreis
- **MN** = vorgenannter Erzeugerpreisindex im neuen Vertragspreis
- **L** = Tarifentgelt einer Fachkraft der Metallindustrie, Entgeltgruppe 5B, im zuletzt gültigen Vertragspreis
- **LN** = vorgenanntes Tarifentgelt im neuen Vertragspreis

Der Materialpreisindex basiert auf dem Preisindex des Statistischen Bundesamtes. Der AN teilt dem AG eine Preisanpassung spätestens zwei Monate vor deren Inkrafttreten schriftlich mit. Kündigt der AG den Vertrag nicht innerhalb eines Monats nach Zugang der Mitteilung zum Zeitpunkt des Inkrafttretens der Preisanpassung, gilt die Preisanpassung als akzeptiert.

## § 5 Pflichten des Auftraggebers

Der AG ist verpflichtet:

1. dem AN und dessen Mitarbeitern jederzeit sicheren und ungehinderten Zugang zu den Anlagen, zugehörigen Maschinenräumen und Schächten zu ermöglichen, einschließlich der Bereitstellung notwendiger Schlüssel;
2. dem AN Störungen, Unfälle, Beschädigungen oder sonstige sicherheitsrelevante Vorkommnisse an den Anlagen unverzüglich zu melden;
3. dem AN das Vorhandensein gefährlicher Stoffe (z. B. Asbest) am Standort unverzüglich mitzuteilen;
4. geplante Änderungen der Nutzung der Anlage oder des Gebäudes sowie Änderungen in den Eigentums- oder Besitzverhältnissen am Standort rechtzeitig anzuzeigen;
5. dem AN unverzüglich mitzuteilen, wenn Dritte während der Vertragslaufzeit Arbeiten an den Anlagen vorgenommen haben;
6. sicherzustellen, dass dem Personal des AN eine sichere Arbeitsumgebung zur Verfügung steht;
7. eine beauftragte Person zur Beaufsichtigung der Aufzugsanlagen gemäß TRBS 3121 Abschnitt 3.3 zu stellen, sofern diese Leistung nicht ausdrücklich vom AN übernommen wird;
8. Änderungen der Rechnungsanschrift, der Ansprechpartner sowie sonstiger vertraglicher Kontaktdaten unverzüglich schriftlich mitzuteilen;
9. sollte die Anlage eine Gefahr für Personen darstellen, diese unverzüglich außer Betrieb zu nehmen und den AN zu informieren.

Der AN haftet nicht für Schäden, die darauf zurückzuführen sind, dass der AG den vorstehenden Verpflichtungen nicht nachgekommen ist. Der AG stellt den AN von sämtlichen Ansprüchen Dritter frei, die aus einer Verletzung der vorgenannten Pflichten resultieren.

## § 6 Haftung und Haftungsbeschränkung

Der AN haftet für Schäden, die durch seine schuldhaften Pflichtverletzungen entstehen, nach den gesetzlichen Bestimmungen. Die Haftung für leichte Fahrlässigkeit ist — soweit gesetzlich zulässig — ausgeschlossen, sofern es sich nicht um die Verletzung wesentlicher Vertragspflichten (Kardinalpflichten), um Schäden aus der Verletzung des Lebens, des Körpers oder der Gesundheit oder um Ansprüche nach dem Produkthaftungsgesetz handelt.

Der AN haftet nicht für Schäden, die verursacht werden durch:

- Ereignisse außerhalb des zumutbaren Einflussbereichs des AN (insbesondere höhere Gewalt, Feuer, Wasser, Vandalismus, Cyberangriffe, Netzausfälle);
- Eingriffe Dritter an der Anlage ohne vorherige schriftliche Zustimmung des AN;
- unterlassene Meldungen von Störungen oder Unfällen durch den AG;
- nicht durchgeführte, vom AN empfohlene oder gesetzlich vorgeschriebene Reparaturen oder Modernisierungen, deren Ausführung der AG abgelehnt hat.

In allen übrigen Fällen ist die Gesamthaftung des AN für innerhalb eines Zeitraums von zwölf Monaten entstandene Schäden auf 5 % der in diesem Zeitraum vom AG geleisteten Vergütung begrenzt, soweit keine vorsätzliche oder grob fahrlässige Pflichtverletzung vorliegt.

## § 7 Gewährleistung für Materialien

Vom AN gelieferte Materialien und Ersatzteile entsprechen Originalteilen oder Teilen gleichwertiger Qualität und Funktionalität. Das Eigentum an gelieferten Materialien geht erst mit vollständiger Bezahlung auf den AG über.

Der AN gewährt auf die von ihm gelieferten und eingebauten Materialien eine Gewährleistungsfrist von 24 Monaten ab Einbau, bei nicht sofortigem Einbau ab Lieferung. Ausgenommen sind Schäden durch normale Abnutzung oder durch Ereignisse außerhalb des Einflussbereichs des AN.

Stellt der AG einen Mangel fest, hat er diesen unverzüglich schriftlich beim AN anzuzeigen. Der AN ist berechtigt, den Mangel durch Nachbesserung oder Ersatzlieferung zu beheben. Weitergehende Ansprüche, insbesondere auf Rücktritt oder Minderung, sind — soweit gesetzlich zulässig — ausgeschlossen.

## § 8 Vertragslaufzeit und Kündigung

### 8.1 Beginn und Laufzeit

Dieser Vertrag beginnt am **{{start_datum}}** und wird für eine Laufzeit von **{{laufzeit_monate}} Monaten** geschlossen. Wird der Vertrag nicht von einer Partei mit einer Frist von mindestens 90 Tagen vor Ablauf der jeweiligen Laufzeit schriftlich gekündigt, verlängert er sich automatisch um jeweils 12 weitere Monate.

### 8.2 Ordentliche Kündigung

Beide Parteien können den Vertrag mit einer Frist von 90 Tagen zum Ende der jeweiligen Vertragslaufzeit schriftlich kündigen.

### 8.3 Außerordentliche Kündigung

Jede Partei ist berechtigt, den Vertrag aus wichtigem Grund fristlos schriftlich zu kündigen. Ein wichtiger Grund liegt insbesondere vor, wenn:

- eine Partei trotz schriftlicher Abmahnung und Setzung einer angemessenen Nachfrist wesentliche Vertragspflichten verletzt;
- eine Partei 30 Tage oder länger durch höhere Gewalt an der Erfüllung ihrer vertraglichen Pflichten gehindert ist;
- über das Vermögen einer Partei ein Insolvenzverfahren eröffnet oder die Eröffnung mangels Masse abgelehnt wird;
- der AG Dritte ohne vorherige schriftliche Zustimmung des AN mit Wartungs- oder Reparaturarbeiten an den Vertragsanlagen beauftragt;
- der AG dem AN den Zugang zur Anlage dauerhaft verweigert oder keine sichere Arbeitsumgebung bereitstellt und den Zustand nicht innerhalb von 30 Tagen nach schriftlicher Aufforderung behebt;
- wesentliche Änderungen der Eigentumsverhältnisse am Standort eintreten, ohne dass eine Nachfolgevereinbarung zustande kommt.

Kündigt der AN den Vertrag aus einem vom AG zu vertretenden Grund, ist der AN berechtigt, als pauschalierten Schadensersatz 20 % des Vergütungsbetrags zu verlangen, den der AG bei regulärem Ablauf des Vertrages noch hätte zahlen müssen. Dem AG bleibt der Nachweis eines geringeren Schadens vorbehalten.

### 8.4 Vorübergehende Stilllegung

Bei vorübergehender Stilllegung einer Anlage ruht der Vertrag für die vereinbarte Stillstandsdauer. Zur Erhaltung der technischen Betriebsfähigkeit führt der AN eine Stillstandswartung mit angepasstem Intervall und gesondertem Pauschalpreis durch. Vor Wiederinbetriebnahme prüft der AN die Anlage auf etwaigen Reparatur- und Ersatzteilbedarf; die entstehenden Kosten trägt der AG.

Bei dauerhafter Stilllegung oder Demontage einer Anlage erlischt der Vertrag für die betreffende Anlage zum Ende des laufenden Kalendermonats, sofern dem AN die Stilllegung mindestens drei Monate zuvor schriftlich angezeigt wurde.

### 10.5 Salvatorische Klausel

Sollten einzelne Bestimmungen dieses Vertrages unwirksam oder undurchführbar sein oder werden, berührt dies die Wirksamkeit der übrigen Bestimmungen nicht. Die unwirksame oder undurchführbare Bestimmung ist durch eine solche zu ersetzen, die dem wirtschaftlichen Sinngehalt und Zweck der unwirksamen Bestimmung am nächsten kommt.

### 10.6 Anwendbares Recht und Gerichtsstand

Auf diesen Vertrag findet ausschließlich deutsches Recht unter Ausschluss des UN-Kaufrechts (CISG) Anwendung. Ausschließlicher Gerichtsstand für alle Streitigkeiten aus oder im Zusammenhang mit diesem Vertrag ist der Geschäftssitz des AN, sofern der AG Kaufmann, juristische Person des öffentlichen Rechts oder öffentlich-rechtliches Sondervermögen ist.

### 10.7 Korruptionsvermeidung und Compliance

Beide Parteien verpflichten sich, bei der Erfüllung ihrer Verpflichtungen aus diesem Vertrag alle einschlägigen gesetzlichen Vorschriften zu beachten, insbesondere solche betreffend Korruptionsprävention, Geldwäsche und Handelssanktionen. Jede Partei verpflichtet sich, keinerlei unzulässige Zuwendungen anzubieten, zu versprechen, zu gewähren oder anzunehmen.

async function _eiWvBuildVertragPdf(opts, parties) {
  const P = window.PDFLib;
  if (!P) throw new Error('PDFLib (pdf-lib) nicht geladen');
  const md = _eiWvRenderVertrag(opts, parties);
  const doc = await P.PDFDocument.create();
  const helv = await doc.embedFont(P.StandardFonts.Helvetica);
  const bold = await doc.embedFont(P.StandardFonts.HelveticaBold);
  const rgb = P.rgb;
  const A4 = [595.28, 841.89], ML = 56, MR = 56, MT = 64, MB = 50;
  const PW = A4[0], PH = A4[1], CW = PW - ML - MR;
  const NAVY = rgb(0.10, 0.23, 0.36), INK = rgb(0.07, 0.10, 0.16), SOFT = rgb(0.42, 0.47, 0.56), MUTE = rgb(0.58, 0.64, 0.71), GREEN = rgb(0.49, 0.76, 0.26), RULE = rgb(0.80, 0.84, 0.89);
  const safe = (t) => (typeof _winAnsiSafe === 'function') ? _winAnsiSafe(String(t == null ? '' : t)) : String(t == null ? '' : t);
  let logo = null;
  try { if (typeof _lvLoadLiftaroLogo === 'function') logo = await _lvLoadLiftaroLogo(doc); } catch (_) {}
  let page, y;
  const headerBar = (p) => {
    p.drawRectangle({ x: 0, y: PH - 4, width: PW, height: 4, color: GREEN });
    if (logo && logo.width) { const lw = 84, lh = logo.height * (lw / logo.width); p.drawImage(logo, { x: PW - MR - lw, y: PH - 16 - lh, width: lw, height: lh }); }
    else { p.drawText('liftaro', { x: PW - MR - 56, y: PH - 28, size: 15, font: bold, color: NAVY }); }
  };
  const newPage = () => { page = doc.addPage(A4); y = PH - MT; headerBar(page); };
  newPage();
  const ensure = (need) => { if (y - need < MB + 18) newPage(); };
  const spaceW = (size) => helv.widthOfTextAtSize(' ', size);
  const wordsOf = (s) => String(s).split(/\s+/).filter(Boolean);
  // Inline-Fett-fähiges, umbrechendes Textzeichnen
  const drawRich = (text, o) => {
    o = o || {};
    const size = o.size || 10, lineH = o.lineH || size * 1.45, color = o.color || INK, indent = o.indent || 0, baseBold = !!o.bold;
    const maxW = CW - indent;
    const segs = String(text).split('**');
    const wl = [];
    segs.forEach((seg, i) => { const b = baseBold !== (i % 2 === 1); wordsOf(seg).forEach(w => wl.push({ w: safe(w), b })); });
    let lineWords = [];
    const widthOf = (arr) => { let wd = 0; arr.forEach((tok, i) => { const f = tok.b ? bold : helv; if (i > 0) wd += spaceW(size); wd += f.widthOfTextAtSize(tok.w, size); }); return wd; };
    const flush = () => {
      if (!lineWords.length) return;
      ensure(lineH);
      let x = ML + indent;
      lineWords.forEach((tok, i) => { const f = tok.b ? bold : helv; if (i > 0) x += spaceW(size); page.drawText(tok.w, { x, y, size, font: f, color }); x += f.widthOfTextAtSize(tok.w, size); });
      y -= lineH; lineWords = [];
    };
    wl.forEach(tok => { const test = lineWords.concat([tok]); if (widthOf(test) > maxW && lineWords.length) { flush(); lineWords = [tok]; } else { lineWords = test; } });
    flush();
  };
  const rule = () => { ensure(14); y -= 3; page.drawLine({ start: { x: ML, y }, end: { x: PW - MR, y }, thickness: 0.7, color: RULE }); y -= 11; };
  const sigline = () => { ensure(30); y -= 16; page.drawLine({ start: { x: ML, y }, end: { x: ML + 230, y }, thickness: 0.9, color: INK }); y -= 12; };
  // Leistungsübersicht-Tabelle
  let tbl = null;
  const flushTable = () => {
    if (!tbl) return;
    const rows = tbl.filter(r => !/^\|?\s*:?-{2,}/.test(r.replace(/\|/g, '').trim() ? r : '|') && !/^\|[\s:\-|]+\|$/.test(r));
    const data = tbl.filter(r => !/^\|[\s:\-|]+\|$/.test(r));
    ensure(20); y -= 2;
    data.forEach((r, ri) => {
      const cells = r.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const label = cells[0] || '', val = cells[1] || '';
      ensure(15);
      const head = ri === 0;
      page.drawText(safe(label), { x: ML + 4, y, size: 9.5, font: head ? bold : helv, color: head ? SOFT : INK });
      page.drawText(safe(val), { x: ML + CW * 0.6, y, size: 9.5, font: bold, color: head ? SOFT : NAVY });
      y -= 14.5;
    });
    y -= 4; tbl = null;
  };
  // Markdown zeilenweise
  const lines = md.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (/^\|/.test(t)) { (tbl = tbl || []).push(t); continue; } else if (tbl) { flushTable(); }
    if (!t) { y -= 5; continue; }
    if (t === '---') { rule(); continue; }
    if (t === '[[SIGLINE]]') { sigline(); continue; }
    if (/^#\s+/.test(t)) { ensure(28); y -= 2; drawRich(t.replace(/^#\s+/, ''), { bold: true, size: 18, color: NAVY, lineH: 23 }); y -= 6; continue; }
    if (/^##\s+/.test(t)) { ensure(26); y -= 9; drawRich(t.replace(/^##\s+/, ''), { bold: true, size: 13.5, color: NAVY, lineH: 18 }); y -= 3; continue; }
    if (/^###\s+/.test(t)) { ensure(20); y -= 4; drawRich(t.replace(/^###\s+/, ''), { bold: true, size: 11.5, color: INK, lineH: 15.5 }); y -= 1; continue; }
    if (/^[-*]\s+/.test(t)) { ensure(15); page.drawText('-', { x: ML + 6, y, size: 10, font: bold, color: NAVY }); drawRich(t.replace(/^[-*]\s+/, ''), { size: 10, lineH: 14, indent: 16 }); continue; }
    const mn = t.match(/^(\d+)\.\s+(.*)$/);
    if (mn) { ensure(15); page.drawText(mn[1] + '.', { x: ML + 4, y, size: 10, font: bold, color: NAVY }); drawRich(mn[2], { size: 10, lineH: 14, indent: 22 }); continue; }
    drawRich(t, { size: 10, lineH: 14.5 });
  }
  if (tbl) flushTable();
  // Footer
  const pages = doc.getPages();
  for (let i = 0; i < pages.length; i++) {
    pages[i].drawText(safe('Liftaro GmbH · Wartungsvertrag · Seite ' + (i + 1) + ' / ' + pages.length), { x: ML, y: 26, size: 7.5, font: helv, color: MUTE });
  }
  return await doc.save();
}

async function submitWvAngebot(ctx) {
  const preis = parseFloat(String(($('wvPreis') || {}).value || '').replace(',', '.')) || 0;
  if (!preis || preis <= 0) { alert('Bitte tragen Sie eine gültige Jahrespauschale (netto) ein.'); $('wvPreis') && $('wvPreis').focus(); return; }
  const sigName = String(($('wvSigName') || {}).value || '').trim();
  if (!sigName) { alert('Bitte den Namen des Unterzeichners eintragen.'); $('wvSigName') && $('wvSigName').focus(); return; }
  const cb = $('wvConfirm');
  if (!cb || !cb.checked) { alert('Bitte die Bestätigungs-Checkbox aktivieren.'); cb && cb.focus(); return; }
  const btn = $('submitBtn'); if (btn) { btn.disabled = true; btn.textContent = '⏳ Sende …'; }
  const base = await getPartnerApiUrl();
  if (!base) { if (btn) { btn.disabled = false; btn.textContent = '📤 Angebot absenden'; } alert('Konfigurationsfehler: kein Submit-Endpoint. Bitte den Absender kontaktieren.'); return; }
  const turnus = (ctx.wv && ctx.wv.optionen && ctx.wv.optionen.abrechnung_turnus) || 'jaehrlich';
  const turnusLabel = (turnus === 'quartalsweise') ? 'quartalsweise' : 'jährlich';
  // v1.13.1: response_json wird als Positions-ARRAY gesendet (1 Position = Jahrespauschale),
  // damit es 1:1 zum Reparatur-Flow passt — der Partner-API-Val (positionen.map) sowie alle
  // Liftaro-Leser verarbeiten es dann ohne Sonderbehandlung (kein Backend-Change nötig).
  const payload = {
    response_json: JSON.stringify([{
      pos_nr: 1,
      titel: 'Wartungsvertrag — Jahrespauschale',
      menge: 1,
      einheit: 'Jahr',
      preis_eur: preis,
      bemerkung: 'Verbindliche Jahres-Wartungspauschale (netto), Abrechnung ' + turnusLabel + '.'
    }]),
    signatur_name: sigName, signatur_methode: 'digital',
    bestaetigung_text: 'Verbindliche Angebotsabgabe (Wartungsvertrag): Jahrespauschale ' + preis.toFixed(2) + ' EUR netto.',
    summe_netto_eur: Math.round(preis * 100) / 100,
    lieferzeit_gesamt: '',
  };
  try {
    const r = await fetch(base + '/api/lv-anfragen/' + encodeURIComponent(ctx.token) + '/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error(String(j.error || ('HTTP ' + r.status)));
    window._lvWvSubmission = { ctx, preis, sigName };
    renderWvSubmittedView(ctx, preis);
  } catch (e) {
    console.error('WV-Submit:', e);
    if (btn) { btn.disabled = false; btn.textContent = '📤 Angebot absenden'; }
    alert('Übermittlung fehlgeschlagen: ' + e.message + '\n\nBitte erneut versuchen oder den Absender per Email informieren.');
  }
}

async function downloadWvVertrag(ctx, preis) {
  const btn = $('dlWvBtn');
  if (!window.PDFLib) { alert('PDF-Bibliothek noch nicht geladen — bitte 2 Sek warten.'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Vertrag wird erstellt …'; }
  try {
    const o = Object.assign({}, (ctx.wv && ctx.wv.optionen) || {}, { jahrespreis_netto: preis });
    const _wn = ctx.wn || {};
    const p = Object.assign({}, (ctx.wv && ctx.wv.parties) || {}, { firma_name: _wn.firma || (window._lvWvSubmission && window._lvWvSubmission.sigName) || '', firma_strasse: String(_wn.strasse || ''), firma_plz: String(_wn.plz || ''), firma_ort: String(_wn.ort || ''), vertragsnummer: ctx.anf.id || '' });
    const bytes = await _eiWvBuildVertragPdf(o, p);
    const fn = 'Wartungsvertrag_' + String((ctx.snap && ctx.snap.fabriknummer) || ctx.anf.id || 'LV').replace(/[^A-Za-z0-9_-]+/g, '_') + '.pdf';
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { console.error('WV-PDF:', e); alert('PDF-Erstellung fehlgeschlagen: ' + (e.message || e)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '📄 Wartungsvertrag als PDF herunterladen'; } }
}

async function buildAngebotPdf(sub) {
    // v1.12: 1:1-Port des App-Builders _eiLvBuildAntwortPdf — identisches PDF wie im Chat

  const VAT = 0.19;

  const angNr = 'L-' + (tokenShort || 'XXXXX');

  // Helpers ----------------------------------------------------------------
  function safe(s) {
    // Latin1 + bekannte typographische Zeichen → durch nutzbare ersetzen

      .replace(/[„""]/g, '"')
      .replace(/['']/g, "'")
      .replace(/[–—]/g, '-')
      .replace(/[•●]/g, '*')
      .replace(/[→]/g, '->')
      .replace(/[✓✔]/g, 'OK')

      .replace(/[^\x00-\xff]/g, '?');
  }
  function tw(font, sz, txt) { return font.widthOfTextAtSize(safe(txt), sz); }

    const out = [];
    String(txt || '').split('\n').forEach(ln => {
      const words = ln.split(/(\s+)/);
      let line = '';
      for (const w of words) {
        const test = line + w;
        if (font.widthOfTextAtSize(safe(test), sz) > maxW && line.trim()) { out.push(line.trimEnd()); line = w.trimStart(); }
        else line = test;
      }
      if (line.trim() || ln === '') out.push(line.trimEnd());

    return out;
  }
  function draw(txt, x, yy, font, sz, color) { page.drawText(safe(txt), { x, y: yy, size: sz, font: font || helv, color: color || COL_INK }); }

      if (isHeader) { y -= 4; ensureSpace(20); draw(t, M, y, bold, 11, COL_INK); y -= 14; }
      else { const wr = wrap(t, helv, 10, W - 2*M); for (const l of wr) { ensureSpace(14); draw(l, M, y, helv, 10, COL_INK); y -= 13; } }
    }
  }

  // Footer auf jeder Seite — Liftaro-Branding zentral, Wartungsnehmer-Daten rechts
  totalPagesHolder.total = allPages.length;
  allPages.forEach((pg, idx) => {
    const fY = 70;
    pg.drawLine({ start: { x: M, y: fY + 32 }, end: { x: W - M, y: fY + 32 }, thickness: 0.5, color: COL_LIGHT });
    const colW = (W - 2*M) / 3;
    const xCol = [M, M + colW, M + 2 * colW];
    const drawCol = (xi, lblTitel, lines) => {
      pg.drawText(safe(lblTitel), { x: xCol[xi], y: fY + 18, size: 9, font: bold, color: COL_INK });
      let yy = fY + 6;
      for (const l of lines) { if (!l) continue; pg.drawText(safe(l), { x: xCol[xi], y: yy, size: 8.5, font: helv, color: COL_MUTE }); yy -= 10; }
    };
    drawCol(0, 'Liftaro', ['Vermittelt über check.liftaro.de', 'check@liftaro.de']);
    drawCol(1, sub.wn.firma || '-', [
      sub.wn.strasse || '',
      [sub.wn.plz, sub.wn.ort].filter(Boolean).join(' '),
      sub.wn.email || '',
    ]);
    drawCol(2, 'Rechtliches', [
      sub.wn.hrb_nummer ? (sub.wn.hrb_nummer + (sub.wn.hrb_gericht ? ' AG ' + sub.wn.hrb_gericht : '')) : '',
      sub.wn.ust_id ? ('USt-IdNr. ' + sub.wn.ust_id) : '',
      sub.wn.geschaeftsfuehrer ? ('GF: ' + sub.wn.geschaeftsfuehrer) : '',
    ]);
    const pn = 'Angebot ' + angNr + ' - Seite ' + (idx + 1) + ' / ' + totalPagesHolder.total;
    const pnW = helv.widthOfTextAtSize(safe(pn), 8);
    pg.drawText(safe(pn), { x: W - M - pnW, y: 36, size: 8, font: helv, color: COL_MUTE });
  });
  const bytes = await doc.save();
  return new Blob([bytes], { type: 'application/pdf' });
}

  // Start
  load().catch(e => { console.error(e); renderError('Unerwarteter Fehler: ' + e.message); });
})();
</script>
