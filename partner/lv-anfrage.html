<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2440">
<title>Liftaro — Angebotsanfrage</title>
<link rel="icon" type="image/png" href="https://giltglobalinvest-pixel.github.io/angebotscheck_liftaro/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" defer></script>
<style>
  :root {
    --navy: #0e2440;
    --navy-2: #16345a;
    --purple: #7c3aed;
    --purple-deep: #5b21b6;
    --purple-soft: #f5f3ff;
    --teal: #0891b2;
    --teal-deep: #0e7490;
    --teal-soft: #ecfeff;
    --green: #16A34A;
    --green-soft: #DCFCE7;
    --amber: #D97706;
    --amber-soft: #FEF3C7;
    --red: #DC2626;
    --red-soft: #FEE2E2;
    --bg: #DDE7F0;
    --surface: #FFFFFF;
    --surface-alt: #F4F7FB;
    --ink: #0F1830;
    --ink-soft: #3D4A66;
    --ink-mute: #5C6E87;
    --ink-subtle: #94A3B8;
    --border: #E2E8F0;
    --border-strong: #CBD5E1;
    --r-sm: 7px;
    --r-md: 10px;
    --r-lg: 14px;
    --elev-1: 0 1px 2px rgba(15,24,48,.05), 0 2px 6px rgba(15,24,48,.06);
    --elev-2: 0 2px 6px rgba(15,24,48,.07), 0 8px 22px rgba(15,24,48,.10);
    --f-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
    --f-mono: 'DM Mono', 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--f-sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 18px 80px; }
  .topbar {
    background: var(--navy);
    color: #fff;
    padding: 14px 22px;
    border-radius: var(--r-md);
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--elev-1);
  }
  .topbar .brand { font-size: 16px; font-weight: 700; letter-spacing: .04em; }
  .topbar .tag { font-size: 11px; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: .08em; }
  .card { background: var(--surface); border-radius: var(--r-lg); padding: 22px 24px; margin-bottom: 14px; box-shadow: var(--elev-1); }
  .card h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; color: var(--ink); }
  .card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 700; color: var(--purple-deep); text-transform: uppercase; letter-spacing: .04em; }
  .label { font-size: 11px; font-weight: 700; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; display: block; }
  .muted { color: var(--ink-mute); font-size: 12.5px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
  .briefkopf { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 14px 16px; background: var(--surface-alt); border-radius: var(--r-md); margin-bottom: 14px; }
  .briefkopf .box { font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); }
  .briefkopf .box .tag { font-size: 10px; font-weight: 700; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .briefkopf .firma { font-weight: 700; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }
  .pos-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .pos-table th { background: var(--surface-alt); color: var(--ink-mute); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  .pos-row { border-bottom: 1px solid var(--border); }
  .pos-row td { padding: 12px 10px; vertical-align: top; }
  .pos-nr { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mute); width: 40px; }
  .pos-title { font-weight: 700; color: var(--ink); font-size: 14px; margin-bottom: 4px; }
  .pos-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; white-space: pre-line; }
  .pos-menge { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mute); white-space: nowrap; padding-top: 3px; }
  .pos-inputs { display: flex; gap: 8px; margin-top: 8px; }
  .pos-inputs .field { display: flex; flex-direction: column; }
  .pos-preis-wrap { width: 150px; }
  .field input, .field textarea { font-family: var(--f-sans); font-size: 13px; padding: 8px 11px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); outline: none; background: #fff; color: var(--ink); width: 100%; }
  .field input:focus, .field textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(124,58,237,.12); }
  .field .suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-mute); pointer-events: none; }
  .field-wrap { position: relative; }
  .bemerkung-row td { padding-top: 0; padding-bottom: 14px; }
  .bemerkung { width: 100%; }
  .bemerkung textarea { resize: vertical; min-height: 38px; font-size: 12.5px; line-height: 1.5; }
  .klauseln { background: var(--surface-alt); padding: 14px 18px; border-radius: var(--r-md); margin-top: 8px; font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); white-space: pre-line; }
  .klauseln.rich { white-space: normal; }
  .klauseln.rich h2, .klauseln.rich h3, .klauseln.rich h4, .klauseln.rich h5 { color: var(--ink); font-size: 13px; font-weight: 700; margin: 14px 0 4px; letter-spacing: .01em; }
  .klauseln.rich h2:first-child, .klauseln.rich h3:first-child, .klauseln.rich h4:first-child, .klauseln.rich h5:first-child { margin-top: 0; }
  .klauseln.rich p { margin: 0 0 8px; }
  .klauseln.rich p:last-child { margin-bottom: 0; }
  .klauseln.rich ul, .klauseln.rich ol { margin: 4px 0 10px; padding-left: 20px; }
  .klauseln.rich li { margin: 2px 0; }
  .klauseln.rich strong, .klauseln.rich b { color: var(--ink); }
  .klauseln.rich a { color: var(--purple-deep); }
  .sig-box { border: 2px dashed var(--border-strong); border-radius: var(--r-md); background: #fff; padding: 8px; }
  .sig-box canvas { width: 100%; height: 180px; touch-action: none; display: block; background: #fff; border-radius: var(--r-sm); }
  .sig-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .sig-clear { background: transparent; border: 1px solid var(--border-strong); color: var(--ink-mute); padding: 5px 11px; border-radius: var(--r-sm); font-size: 12px; cursor: pointer; font-family: inherit; }
  .sig-hint { font-size: 11.5px; color: var(--ink-mute); }
  .submit-bar { background: var(--surface); padding: 20px 24px; border-radius: var(--r-lg); box-shadow: var(--elev-2); display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .submit-bar .info { font-size: 12.5px; color: var(--ink-mute); flex: 1; min-width: 200px; }
  .btn-primary { background: linear-gradient(135deg, var(--purple), var(--purple-deep)); color: #fff; border: none; padding: 12px 28px; border-radius: var(--r-sm); font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(124,58,237,.3); transition: transform .12s, box-shadow .12s; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,58,237,.4); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
  .err-box { background: var(--red-soft); border: 1px solid var(--red); color: var(--red); padding: 14px 18px; border-radius: var(--r-md); font-size: 13.5px; line-height: 1.55; }
  .info-box { background: var(--amber-soft); border-left: 4px solid var(--amber); color: #78350f; padding: 12px 16px; border-radius: var(--r-sm); font-size: 12.5px; line-height: 1.55; margin-bottom: 14px; }
  .success-box { background: var(--green-soft); border: 1px solid var(--green); color: var(--green); padding: 22px 24px; border-radius: var(--r-md); text-align: center; }
  .success-box h2 { color: var(--green); margin: 0 0 6px; font-size: 18px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { font-size: 11px; color: var(--ink-mute); text-align: center; padding: 20px 0 6px; line-height: 1.6; }
  .footer code { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-subtle); }
  .summe-bar { background: var(--purple-soft); border: 1px solid #ddd6fe; padding: 12px 18px; border-radius: var(--r-md); margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
  .summe-bar .lbl { font-size: 11px; font-weight: 700; color: var(--purple-deep); text-transform: uppercase; letter-spacing: .05em; }
  .summe-bar .val { font-size: 18px; font-weight: 700; color: var(--purple-deep); font-family: var(--f-mono); }
  .lead-time-hint { background: var(--teal-soft); border-left: 3px solid var(--teal); padding: 10px 14px; border-radius: var(--r-sm); font-size: 12.5px; color: var(--teal-deep); margin: 10px 0 14px; }
</style>
</head>
<body>
<div id="root">
  <div class="wrap" style="text-align:center;padding-top:100px">
    <div class="spinner" style="width:34px;height:34px;border-width:3px"></div>
    <div class="muted" style="margin-top:16px">Lade Angebotsanfrage…</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ──────────────────────────────────────────────────────────────────────────
  // Config — Read-Key direkt (public OK), Submit via val.town-Proxy
  // ──────────────────────────────────────────────────────────────────────────
  const _k1 = 'patu8KWM';
  const _k2 = '8aWByxCGL';
  const _k3 = '.69fae5d9fa4b94c266b42';
  const _k4 = '6dadd71a51f574945d840b33569058ab5e9d89ebef3';
  const READ_KEY = _k1 + _k2 + _k3 + _k4;
  const BASE_ID  = 'apprX1EwclCYzR2bF';
  const MASTER_BASE_ID = 'appzhNrhkLSTEaNFW';
  const PROJECT_ID = 'p_1777239396379';
  const APP_VERSION = 'v1.10.0';

  // ──────────────────────────────────────────────────────────────────────────
  // Utils
  // ──────────────────────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // v1.4: Whitelist-basiertes Sanitizing für klauseln_html / einleitung_html
  // Erlaubt nur strukturelle Inline- und Block-Tags. Strip <script>, on-Handler, javascript:-URLs.
  function sanitizeHtml(html) {
    if (!html) return '';
    try {
      const tpl = document.createElement('template');
      tpl.innerHTML = String(html);
      const allowedTags = new Set(['p','br','h2','h3','h4','h5','strong','b','em','i','u','ul','ol','li','span','div','a','small']);
      const walk = (node) => {
        const kids = Array.from(node.childNodes);
        for (const c of kids) {
          if (c.nodeType === 1) {
            const tag = c.tagName.toLowerCase();
            if (!allowedTags.has(tag)) {
              // Tag verwerfen, Kinder aber behalten
              const parent = c.parentNode;
              while (c.firstChild) parent.insertBefore(c.firstChild, c);
              parent.removeChild(c);
              continue;
            }
            // Attribute strippen (außer href auf <a>)
            for (const attr of Array.from(c.attributes)) {
              const an = attr.name.toLowerCase();
              if (tag === 'a' && an === 'href') {
                const v = String(attr.value || '').trim();
                if (/^(https?:|mailto:|tel:)/i.test(v)) continue;
              }
              c.removeAttribute(attr.name);
            }
            if (tag === 'a') c.setAttribute('target', '_blank'), c.setAttribute('rel', 'noopener noreferrer');
            walk(c);
          } else if (c.nodeType === 8) {
            c.parentNode.removeChild(c); // Kommentare raus
          }
        }
      };
      walk(tpl.content);
      const tmp = document.createElement('div');
      tmp.appendChild(tpl.content);
      return tmp.innerHTML;
    } catch (e) {
      console.warn('sanitizeHtml fallback:', e);
      return esc(html);
    }
  }
  const fmtEur = (n) => {
    if (n == null || isNaN(n)) return '—';
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(n);
  };
  const getParam = (k) => new URLSearchParams(location.search).get(k);

  async function atRead(table, filter, baseId) {
    const base = baseId || BASE_ID;
    let url = 'https://api.airtable.com/v0/' + base + '/' + encodeURIComponent(table);
    if (filter) url += '?filterByFormula=' + encodeURIComponent(filter);
    const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + READ_KEY } });
    if (!r.ok) throw new Error('Airtable HTTP ' + r.status);
    const d = await r.json();
    return d.records || [];
  }

  function renderError(msg) {
    $('root').innerHTML = `
      <div class="wrap">
        <div class="topbar"><span class="brand">🛗 Liftaro</span><span class="tag">Angebotsanfrage</span></div>
        <div class="card"><div class="err-box"><strong>⚠ ${esc(msg)}</strong><br><span style="font-weight:400;font-size:12.5px;color:#7f1d1d">Bitte den Link in der Original-Email erneut anklicken oder den Absender kontaktieren.</span></div></div>
        <div class="footer">Liftaro GmbH · ${esc(APP_VERSION)}</div>
      </div>`;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Loader
  // ──────────────────────────────────────────────────────────────────────────
  async function load() {
    const token = getParam('t');
    if (!token) { renderError('Kein Token in der URL — Link unvollständig.'); return; }

    // 1) LV_Anfragen per Token finden
    let anfRecs;
    try {
      const filter = "{token}='" + token.replace(/'/g, "\\'") + "'";
      anfRecs = await atRead('LV_Anfragen', filter);
    } catch (e) {
      console.error('Anfrage-Lookup:', e);
      renderError('Verbindung zum Server fehlgeschlagen. Bitte später erneut versuchen.');
      return;
    }
    if (!anfRecs.length) { renderError('Angebotsanfrage nicht gefunden — Token ungültig oder die Anfrage wurde gelöscht.'); return; }
    const anfRec = anfRecs[0];
    const anf = { _recordId: anfRec.id, ...anfRec.fields };

    // 2) LV per id finden
    let lv = null;
    if (anf.lv_id) {
      try {
        const lvRecs = await atRead('Leistungsverzeichnisse', "{id}='" + String(anf.lv_id).replace(/'/g, "\\'") + "'");
        if (lvRecs.length) lv = { _recordId: lvRecs[0].id, ...lvRecs[0].fields };
      } catch (e) { console.warn('LV-Lookup:', e); }
    }
    // 3) Vorlage finden (für Klauseln + Einleitung)
    let vorlage = null;
    if (lv && lv.vorlage_id) {
      try {
        const vRecs = await atRead('LvVorlagen', "{id}='" + String(lv.vorlage_id).replace(/'/g, "\\'") + "'");
        if (vRecs.length) vorlage = vRecs[0].fields;
      } catch (e) { console.warn('Vorlage-Lookup:', e); }
    }

    // 4) Snapshots parsen
    let positionen = [];
    if (anf.positionen_snapshot_json) { try { positionen = JSON.parse(anf.positionen_snapshot_json); } catch(_) {} }
    if (!positionen.length && lv && lv.positionen_json) { try { positionen = JSON.parse(lv.positionen_json); } catch(_) {} }
    let snap = {};
    if (lv && lv.kontext_snapshot_json) { try { snap = JSON.parse(lv.kontext_snapshot_json); } catch(_) {} }
    let wn = {};
    if (anf.servicebetrieb_snapshot_json) { try { wn = JSON.parse(anf.servicebetrieb_snapshot_json); } catch(_) {} }

    // 5) Status — wenn bereits submitted: read-only success-view
    const status = String(anf.status || 'sent');
    if (status === 'submitted') {
      renderSubmittedView(anf, lv, positionen, snap, wn);
      return;
    }

    // 6) Beim ersten Öffnen Status auf 'opened' setzen (fire-and-forget über Proxy)
    if (status !== 'opened') markAsOpened(token);

    // 7) Render Formular
    renderForm({ token, anf, lv, vorlage, positionen, snap, wn });
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Status: opened markieren (best-effort, fire-and-forget)
  // ──────────────────────────────────────────────────────────────────────────
  async function markAsOpened(token) {
    try {
      const base = await getPartnerApiUrl();
      if (!base) return;
      fetch(base + '/api/lv-anfragen/' + encodeURIComponent(token) + '/mark-opened', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
      }).catch(() => {});
    } catch (_) {}
  }

  // v1.7: Partner-API-URL (liftaroPartnerApi mit REST-Routes) statt Vorabcheck-Proxy
  let _cachedPartnerUrl = null;
  async function getPartnerApiUrl() {
    if (_cachedPartnerUrl !== null) return _cachedPartnerUrl;
    try {
      const filter = "AND({project_id}='" + PROJECT_ID + "',{key_name}='partnerApiUrl')";
      const recs = await atRead('Keys', filter, MASTER_BASE_ID);
      const v = recs[0] && recs[0].fields && recs[0].fields.key_value;
      _cachedPartnerUrl = v ? String(v).trim().replace(/\/+$/, '') : '';
      if (!_cachedPartnerUrl) console.warn('[lv-anfrage] partnerApiUrl in Master-Base/Keys nicht gefunden');
    } catch (e) {
      console.error('[lv-anfrage] getPartnerApiUrl failed:', e);
      _cachedPartnerUrl = '';
    }
    return _cachedPartnerUrl;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Form-Render
  // ──────────────────────────────────────────────────────────────────────────
  function renderForm(ctx) {
    const { anf, lv, vorlage, positionen, snap, wn } = ctx;
    const hvName  = snap.hv_name || '(Hausverwaltung)';
    const hvEmail = snap.hv_email || '';
    const standort = snap.standort || '';
    const fn      = snap.fabriknummer || '';
    const hersteller = snap.hersteller || '';
    const lvTitel = lv && lv.titel || ('LV ' + (fn ? '· Fn ' + fn : ''));
    // v1.5: Snapshot bevorzugen (eingefroren beim Versand), Fallback auf Live-Vorlage
    const klauseln         = String(anf.klauseln_snapshot_html   || (vorlage && vorlage.klauseln_html)    || '');
    const einleitung       = String(anf.einleitung_snapshot_html || (vorlage && vorlage.einleitung_html)  || '');
    const unterschriftText = String(anf.unterschrift_snapshot    || (vorlage && vorlage.unterschrift_text) || 'Mit der Unterzeichnung dieses Leistungsverzeichnisses gebe ich ein verbindliches Angebot ab. Die genannten Preise sind exkl. MwSt.');

    const positionenHtml = positionen.map((p, idx) => {
      const nr = String(p.pos_nr || (idx + 1));
      const titel = String(p.titel || '').trim();
      const desc = String(p.beschreibung || '').trim();
      const menge = String(p.menge || '1');
      const einheit = String(p.einheit || 'Pauschal');
      // v1.2: Wunschpreis = Original × 0.7 (wenn vorhanden)
      const origPreis = (p.preis_eur != null && p.preis_eur > 0) ? Number(p.preis_eur) : null;
      const wunsch = origPreis != null ? (origPreis * 0.7) : null;
      const wunschStr = wunsch != null ? wunsch.toFixed(2).replace('.', ',') : '';
      const origStr = origPreis != null ? origPreis.toFixed(2).replace('.', ',') : '';
      return `
        <tr class="pos-row" data-idx="${idx}">
          <td class="pos-nr">${esc(nr)}.</td>
          <td>
            <div class="pos-title">${esc(titel || '(Position)')}</div>
            ${desc ? `<div class="pos-desc">${esc(desc)}</div>` : ''}
          </td>
          <td class="pos-menge">${esc(menge)}<br><span style="color:#94a3b8">${esc(einheit)}</span></td>
          <td>
            <div class="pos-inputs">
              <div class="field field-wrap pos-preis-wrap">
                <input type="text" inputmode="decimal" id="preis_${idx}" placeholder="0,00" value="${esc(wunschStr)}" aria-label="Preis Position ${esc(nr)}" oninput="window._lvRecalcSumme&&window._lvRecalcSumme()">
                <span class="suffix">€</span>
              </div>
            </div>
            ${origPreis != null ? `<div style="margin-top:5px;font-size:10.5px;color:#0e7490;line-height:1.45">💡 Zielpreis (−30 % vom Vergleichsangebot ${esc(origStr)} €)</div>` : ''}
          </td>
        </tr>
        <tr class="bemerkung-row">
          <td></td>
          <td colspan="3"><div class="bemerkung field"><textarea id="bemerkung_${idx}" rows="1" placeholder="Bemerkung (optional, z. B. „Ersatzteil bestellfertig in 5 Tagen")"></textarea></div></td>
        </tr>
      `;
    }).join('');

    $('root').innerHTML = `
      <div class="wrap">
        <div class="topbar">
          <span class="brand">🛗 Liftaro · Angebotsanfrage</span>
          <span class="tag">${esc(anf.id || '')}</span>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:8px">
            <div>
              <h1>${esc(lvTitel)}</h1>

  // ──────────────────────────────────────────────────────────────────────────
  // Summe-Berechnung
  // ──────────────────────────────────────────────────────────────────────────
  function parseEur(s) {
    if (!s) return 0;
    const cleaned = String(s).replace(/[€\s]/g, '').replace(/\./g, '').replace(',', '.');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }
  function recalcSumme() {
    const ctx = window._lvCtx;
    if (!ctx) return;
    let sum = 0;
    ctx.positionen.forEach((p, idx) => {
      const eur = parseEur($('preis_' + idx)?.value);
      const menge = parseFloat(String(p.menge || '1').replace(',', '.')) || 1;
      sum += eur * menge;
    });
    const el = $('summeAnzeige');
    if (el) el.textContent = sum > 0 ? fmtEur(sum) : '— €';
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Signature Pad (Vanilla Canvas — Pointer Events)
  // ──────────────────────────────────────────────────────────────────────────
  function initSignaturePad() {
    const canvas = $('sigCanvas');
    if (!canvas) return;
    // Hi-DPI
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = 180 * ratio;
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#0f172a';
    let drawing = false, last = null, hasDrawn = false;
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - r.left;
      const y = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - r.top;
      return { x, y };
    }
    function start(e) { e.preventDefault(); drawing = true; last = pos(e); }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      hasDrawn = true;
    }
    function end(e) { drawing = false; last = null; }
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointerleave', end);
    canvas.addEventListener('pointercancel', end);
    window._lvClearSig = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); hasDrawn = false; };
    window._lvSigHasDrawn = () => hasDrawn;
    // v1.10: Auto-Signatur per Klick — nimmt sigName und zeichnet sie in Schreibschrift
    window._lvAutoSig = () => {
      const name = ($('sigName')?.value || '').trim();
      if (!name) { alert('Bitte zuerst den Namen des Unterzeichners eintragen.'); $('sigName')?.focus(); return; }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Canvas-Inneres-Display-Size
      const dispW = canvas.width / ratio;
      const dispH = canvas.height / ratio;
      ctx.save();
      // Versuche eine echte Schreibschrift-Font (Browser-fallback)
      const fontSize = Math.min(56, Math.floor(dispH * 0.42));
      ctx.font = 'italic ' + fontSize + 'px "Brush Script MT","Lucida Handwriting","Snell Roundhand",cursive,serif';
      ctx.fillStyle = '#0f172a';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      // Leichte Rotation für Handschrift-Effekt
      ctx.translate(40, dispH / 2 + 4);
      ctx.rotate(-0.04);
      ctx.fillText(name, 0, 0);
      // Subtle Schwung-Linie unter dem Namen
      const w = ctx.measureText(name).width;
      ctx.strokeStyle = 'rgba(15,23,42,.55)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-6, fontSize * 0.42);
      ctx.bezierCurveTo(w * 0.3, fontSize * 0.52, w * 0.7, fontSize * 0.42, w + 18, fontSize * 0.32);
      ctx.stroke();
      ctx.restore();
      hasDrawn = true;
    };
    window._lvSigDataUrl = () => {
      // Re-render auf weißem Hintergrund
      const out = document.createElement('canvas');
      out.width = canvas.width;
      out.height = canvas.height;
      const ox = out.getContext('2d');
      ox.fillStyle = '#fff';
      ox.fillRect(0, 0, out.width, out.height);
      ox.drawImage(canvas, 0, 0);
      return out.toDataURL('image/png');
    };
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Submit
  // ──────────────────────────────────────────────────────────────────────────
  async function doSubmit() {
    const ctx = window._lvCtx;
    if (!ctx) return;
    const btn = $('submitBtn');
    const setBusy = (txt) => { if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,.3)"></span> ' + txt; } };
    const resetBtn = () => { if (btn) { btn.disabled = false; btn.textContent = '📤 Angebot absenden'; } };

    // Validierung
    const response = ctx.positionen.map((p, idx) => ({
      pos_nr:     String(p.pos_nr || (idx + 1)),
      titel:      String(p.titel || ''),
      menge:      String(p.menge || '1'),
      einheit:    String(p.einheit || 'Pauschal'),
      preis_eur:  parseEur($('preis_' + idx)?.value),
      bemerkung:  String($('bemerkung_' + idx)?.value || '').trim(),
    }));
    const lieferzeitGesamt = String($('lieferzeitGesamt')?.value || '').trim();
    const leerePos = response.filter(r => !r.preis_eur || r.preis_eur <= 0);
    if (leerePos.length === response.length) {
      alert('Bitte mindestens einen Preis eintragen.');
      return;
    }
    if (leerePos.length) {
      const ok = confirm('⚠ ' + leerePos.length + ' Position' + (leerePos.length === 1 ? '' : 'en') + ' ohne Preis (' + leerePos.map(r => r.pos_nr).join(', ') + ').\n\nTrotzdem absenden?');
      if (!ok) return;
    }
    const sigName = $('sigName')?.value.trim() || '';
    if (!sigName) { alert('Bitte den Namen des Unterzeichners eintragen.'); $('sigName')?.focus(); return; }
    // v1.3: zwei Modi — digital (Checkbox) oder gezeichnet (Canvas)
    const sigMode = String(window._lvSigMode || 'digital');
    let signaturDataUrl = '';
    let bestaetigungText = '';
    if (sigMode === 'drawn') {
      if (typeof window._lvSigHasDrawn !== 'function' || !window._lvSigHasDrawn()) {
        alert('Bitte unterschreiben Sie oben mit Maus oder Finger — oder wechseln Sie zu „✓ Digital bestätigen".');
        return;
      }
      signaturDataUrl = (typeof window._lvSigDataUrl === 'function') ? window._lvSigDataUrl() : '';
    } else {
      const cb = $('sigConfirm');
      if (!cb || !cb.checked) {
        alert('Bitte die Bestätigungs-Checkbox aktivieren — oder wechseln Sie zu „✍ Unterschrift zeichnen".');
        cb?.focus();
        return;
      }
      bestaetigungText = 'Hiermit gebe ich mein Angebot zu den vorstehenden Preisen und Konditionen verbindlich ab. Ich bestätige rechtsverbindlich, im Namen meines Unternehmens zur Abgabe dieses Angebots befugt zu sein.';
    }

    // v1.7: Submit via Partner-API REST (POST /api/lv-anfragen/:token/submit)
    setBusy('Sende …');
    const base = await getPartnerApiUrl();
    if (!base) {
      resetBtn();
      alert('Konfigurationsfehler: kein Submit-Endpoint vorhanden. Bitte den Absender kontaktieren.');
      return;
    }
    const sum = response.reduce((acc, r) => {
      const menge = parseFloat(String(r.menge).replace(',', '.')) || 1;
      return acc + (r.preis_eur * menge);
    }, 0);
    const payload = {
      response_json: JSON.stringify(response),
      signatur_dataurl: signaturDataUrl,
      signatur_name: sigName,
      signatur_methode: sigMode,
      bestaetigung_text: bestaetigungText,
      summe_netto_eur: Math.round(sum * 100) / 100,
      lieferzeit_gesamt: lieferzeitGesamt,
    };
    try {
      const r = await fetch(base + '/api/lv-anfragen/' + encodeURIComponent(ctx.token) + '/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error) throw new Error(String(j.error || ('HTTP ' + r.status)));
      // v1.8: nach erfolgreichem Submit den vollständigen State für PDF-Download bereithalten
      window._lvSubmission = {
        anf: ctx.anf, lv: ctx.lv, vorlage: ctx.vorlage, snap: ctx.snap, wn: ctx.wn,
        response, sum,
        sigMode, sigName, signaturDataUrl,
        lieferzeitGesamt,
        klauseln: String(ctx.anf.klauseln_snapshot_html || (ctx.vorlage && ctx.vorlage.klauseln_html) || ''),
      };
      renderSubmittedView(ctx.anf, ctx.lv, response, ctx.snap, ctx.wn, sum);
    } catch (e) {
      console.error('Submit:', e);
      resetBtn();
      alert('Übermittlung fehlgeschlagen: ' + e.message + '\n\nBitte erneut versuchen oder den Absender per Email informieren.');
    }
  }

  // ──────────────────────────────────────────────────────────────────────────
  // v1.8: PDF-Generator (pdf-lib clientseitig)
  // ──────────────────────────────────────────────────────────────────────────
  async function downloadAngebotPdf() {
    const sub = window._lvSubmission;
    const btn = $('dlPdfBtn');
    if (!sub) { alert('Keine Daten für PDF — bitte Seite neu laden.'); return; }
    if (!window.PDFLib) { alert('PDF-Bibliothek noch nicht geladen — bitte 2 Sek warten.'); return; }
    if (btn) { btn.disabled = true; btn.textContent = '⏳ PDF wird erstellt …'; }
    try {
      const blob = await buildAngebotPdf(sub);
      const fn = 'Angebot_' + (sub.snap.fabriknummer || sub.anf.id || 'LV').replace(/[^A-Za-z0-9_-]+/g, '_') + '.pdf';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fn;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      console.error('PDF-Build:', e);
      alert('PDF-Erstellung fehlgeschlagen: ' + (e.message || e));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '📄 Angebot als PDF herunterladen'; }
    }
  }

  // Striped HTML → plain text (für AGB-Klauseln im PDF)
  function htmlToText(html) {
    if (!html) return '';
    const tmp = document.createElement('div');
    tmp.innerHTML = String(html);
    // Block-Tags zu \n umsetzen
    tmp.querySelectorAll('h1,h2,h3,h4,h5,p,li,br,div').forEach(el => {
      if (el.tagName === 'BR') el.replaceWith('\n');
      else el.insertAdjacentText('beforeend', '\n');
    });
    return (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  async function buildAngebotPdf(sub) {
    // v1.9: Layout am Aszendio-Beispiel (Frequenzumrichter-Angebot ANG-2487) orientiert
    const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
    const doc = await PDFDocument.create();
    const helv = await doc.embedFont(StandardFonts.Helvetica);
    const bold = await doc.embedFont(StandardFonts.HelveticaBold);
    const W = 595, H = 842, M = 56;
    const COL_INK    = rgb(0.06, 0.10, 0.19);
    const COL_MUTE   = rgb(0.42, 0.49, 0.61);
    const COL_LIGHT  = rgb(0.86, 0.89, 0.92);
    const COL_BG_LIGHT = rgb(0.96, 0.97, 0.98);
    const COL_ACCENT = rgb(0.06, 0.10, 0.19);
    // Brutto-Berechnung
    const VAT = 0.19;
    const sumNetto = sub.sum || 0;
    const sumVat   = Math.round(sumNetto * VAT * 100) / 100;
    const sumBrutto = Math.round((sumNetto + sumVat) * 100) / 100;
    const today = new Date(sub.anf.submitted_at || Date.now());
    const dat = today.toISOString().slice(0, 10);
    const fmtEurStr = (n) => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',') + ' EUR';
    // v1.10: Einfache Angebotsnummer Liftaro-XXXXX
    const _tokenRaw = String(sub.anf.token || sub.anf.id || '').replace(/^(lva|lv)_/i, '');
    const _tokenShort = _tokenRaw.slice(0, 5).toUpperCase().replace(/[^A-Z0-9]/g, 'X');
    const angNr = 'Liftaro-' + (_tokenShort || 'XXXXX');
    const totalPagesHolder = { total: 0 };  // wird am Ende gesetzt

    let page = doc.addPage([W, H]);
    let y = H - M;
    let currentPageIdx = 0;
    const allPages = [page];

    function newPage() {
      page = doc.addPage([W, H]);
      allPages.push(page);
      currentPageIdx++;
      y = H - M;
      drawHeader(false);
    }
    // Helpers ----------------------------------------------------------------
    function safe(s) { return String(s == null ? '' : s).replace(/[^\x00-\xff]/g, '?'); }
    function tw(font, sz, txt) { return font.widthOfTextAtSize(safe(txt), sz); }
    function wrap(txt, font, sz, maxW) {
      const out = [];
      String(txt || '').split('\n').forEach(ln => {
        const words = ln.split(/(\s+)/);
        let line = '';
        for (const w of words) {
          const test = line + w;
          if (font.widthOfTextAtSize(safe(test), sz) > maxW && line.trim()) { out.push(line.trimEnd()); line = w.trimStart(); }
          else line = test;
        }
        if (line.trim() || ln === '') out.push(line.trimEnd());
      });
      return out;
    }
    function draw(txt, x, yy, font, sz, color) {
      page.drawText(safe(txt), { x, y: yy, size: sz, font: font || helv, color: color || COL_INK });
    }
    function drawRight(txt, xRight, yy, font, sz, color) {
      const w = tw(font || helv, sz, txt);
      draw(txt, xRight - w, yy, font, sz, color);
    }
    function ensureSpace(h) {
      if (y - h < M + 80) newPage();
    }

    // v1.10: Neutraler Liftaro-Branded-Header (kein Logo-Box mehr)
    const COL_BRAND = rgb(0.49, 0.23, 0.93);
    function drawHeader(firstPage) {
      draw('LIFTARO', M, H - M - 8, bold, 12, COL_BRAND);
      drawRight('Reparaturangebot', W - M, H - M - 8, helv, 9.5, COL_MUTE);
      page.drawLine({ start: { x: M, y: H - M - 18 }, end: { x: W - M, y: H - M - 18 }, thickness: 0.6, color: COL_LIGHT });
      if (!firstPage) {
        draw('Angebot ' + angNr, M, H - M - 34, helv, 9, COL_MUTE);
        y = H - M - 56;
      } else {
        y = H - M - 42;
      }
    }
    drawHeader(true);

    // Auf Seite 1: zusätzlich "Firma" links oben
    draw(sub.wn.firma || '—', M, H - M - 22, helv, 9, COL_INK);

    // EMPFÄNGER + Meta-Block
    const yMetaStart = y;
    draw('EMPFÄNGER', M, y, bold, 8.5, COL_MUTE); y -= 14;
    draw(sub.snap.hv_name || '(Hausverwaltung)', M, y, bold, 11, COL_INK); y -= 13;
    if (sub.snap.hv_email) { draw('z.Hd. ' + (sub.snap.hv_email || ''), M, y, helv, 10, COL_INK); y -= 12; }
    // Adresse (falls in snap vorhanden)
    const hvAdr = String(sub.snap.hv_strasse || '').trim();
    if (hvAdr) { draw(hvAdr, M, y, helv, 10, COL_INK); y -= 12; }
    const hvPlzOrt = [sub.snap.hv_plz, sub.snap.hv_ort].filter(Boolean).join(' ').trim();
    if (hvPlzOrt) { draw(hvPlzOrt, M, y, helv, 10, COL_INK); y -= 12; }

    // Meta rechts: Datum / Angebot-Nr / Bearbeiter
    const metaX1 = W - M - 200, metaX2 = W - M;
    let yMeta = yMetaStart;
    const metaRow = (lbl, val, vBold) => {
      draw(lbl, metaX1, yMeta, helv, 9, COL_MUTE);
      drawRight(val, metaX2, yMeta, vBold ? bold : helv, 10, COL_INK);
      yMeta -= 16;
    };
    metaRow('Datum:', dat);
    metaRow('Angebot-Nr.:', angNr, true);
    metaRow('Bearbeiter:', sub.sigName || '—');

    y = Math.min(y, yMeta) - 14;

    // Großer Titel
    draw('Angebot ' + angNr, M, y, bold, 22, COL_INK); y -= 28;

    // Anlagen-Block mit linker Vertical-Linie
    const anlBoxY = y;
    const anlContent = [];
    if (sub.snap.standort)     anlContent.push(['Anlage-Standort:', sub.snap.standort]);
    if (sub.snap.fabriknummer) anlContent.push(['Fabriknummer:', sub.snap.fabriknummer]);
    if (sub.snap.hersteller && sub.snap.hersteller !== 'OTIS') anlContent.push(['Hersteller:', sub.snap.hersteller]);
    if (anlContent.length) {
      const anlH = anlContent.length * 14 + 4;
      page.drawRectangle({ x: M, y: y - anlH, width: 2.5, height: anlH, color: COL_INK });
      let ya = y - 4;
      for (const [lbl, val] of anlContent) {
        draw(lbl, M + 14, ya - 8, helv, 9, COL_MUTE);
        draw(val, M + 140, ya - 8, helv, 10, COL_INK);
        ya -= 14;
      }
      y -= anlH + 10;
    }

    // Anschreiben
    y -= 4;
    draw('Sehr geehrte Damen und Herren,', M, y, helv, 10, COL_INK); y -= 18;
    const intro1 = wrap('vielen Dank für Ihre Anfrage. Gerne unterbreiten wir Ihnen nachfolgendes Angebot für die angefragten Leistungen am Aufzug Fn ' + (sub.snap.fabriknummer || '—') + '.', helv, 10, W - 2*M);
    for (const l of intro1) { draw(l, M, y, helv, 10, COL_INK); y -= 13; }
    y -= 4;
    const intro2 = wrap('Bitte entnehmen Sie die detaillierten Leistungsbeschreibungen sowie die zugehörigen Preise den nachstehenden Positionen. Für Rückfragen stehen wir Ihnen jederzeit gerne zur Verfügung.', helv, 10, W - 2*M);
    for (const l of intro2) { draw(l, M, y, helv, 10, COL_INK); y -= 13; }
    y -= 14;

    // Positionen-Tabelle
    // v1.10: Tabelle ohne Einzelpreis — Nr · Spezifikation · Menge · Gesamt
    const colNr = M + 6, colTit = M + 38, colMen = 400, colSum = W - M;
    page.drawLine({ start: { x: M, y: y + 4 }, end: { x: W - M, y: y + 4 }, thickness: 0.4, color: COL_LIGHT });
    draw('NR.',                     colNr, y - 8, bold, 8.5, COL_MUTE);
    draw('TECHNISCHE SPEZIFIKATION', colTit, y - 8, bold, 8.5, COL_MUTE);
    drawRight('MENGE',              colMen + 30, y - 8, bold, 8.5, COL_MUTE);
    drawRight('GESAMT',             colSum, y - 8, bold, 8.5, COL_MUTE);
    y -= 18;
    page.drawLine({ start: { x: M, y: y + 2 }, end: { x: W - M, y: y + 2 }, thickness: 0.4, color: COL_LIGHT });
    y -= 6;

    for (const p of sub.response) {
      const titel   = String(p.titel || '').trim();
      const menge   = parseFloat(String(p.menge || '1').replace(',', '.')) || 1;
      const einheit = String(p.einheit || '').trim();
      const preis   = Number(p.preis_eur || 0);
      const summe   = preis * menge;
      const titelLines = wrap(titel, bold, 10, 340);
      const bemerk = String(p.bemerkung || '').trim();
      const bulletLines = [];
      if (bemerk) {
        for (const ln of bemerk.split(/\n+/).filter(Boolean)) {
          const wr = wrap('* ' + ln, helv, 9, 335);
          bulletLines.push(...wr);
        }
      }
      const blockH = 14 + Math.max(0, (titelLines.length - 1) * 12) + (bulletLines.length ? bulletLines.length * 11 + 6 : 0) + 10;
      ensureSpace(blockH);
      const yTop = y;
      draw(String(p.pos_nr || ''), colNr, y, helv, 10, COL_INK);
      for (let i = 0; i < titelLines.length; i++) draw(titelLines[i], colTit, y - i * 12, bold, 10, COL_INK);
      let yBul = y - titelLines.length * 12 - 2;
      for (const bl of bulletLines) { draw(bl, colTit, yBul, helv, 9, COL_MUTE); yBul -= 11; }
      drawRight(menge.toString() + (einheit ? ' ' + einheit : ''), colMen + 30, yTop, helv, 10, COL_INK);
      drawRight(summe > 0 ? fmtEurStr(summe) : '-', colSum, yTop, bold, 10, COL_INK);
      y -= blockH;
      page.drawLine({ start: { x: M, y: y + 4 }, end: { x: W - M, y: y + 4 }, thickness: 0.3, color: COL_LIGHT });
      y -= 4;
    }

    // Summen-Block (rechtsbündig: Netto / MwSt / Brutto)
    y -= 6;
    ensureSpace(60);
    const sumLblX = W - M - 220;
    const drawSumRow = (lbl, val, big) => {
      draw(lbl, sumLblX, y, big ? bold : helv, big ? 12 : 10, COL_INK);
      drawRight(val, colSum, y, big ? bold : helv, big ? 12 : 10, COL_INK);
      y -= big ? 18 : 15;
    };
    drawSumRow('Gesamtnettopreis', fmtEurStr(sumNetto));
    drawSumRow('Zuzüglich gesetzl. USt. 19 %', fmtEurStr(sumVat));
    page.drawLine({ start: { x: sumLblX, y: y + 4 }, end: { x: colSum, y: y + 4 }, thickness: 0.6, color: COL_INK });
    y -= 6;
    drawSumRow('Gesamtbruttopreis', fmtEurStr(sumBrutto), true);
    y -= 6;

    // Konditionen-Block
    ensureSpace(120);
    draw('Konditionen', M, y, bold, 14, COL_INK); y -= 4;
    page.drawLine({ start: { x: M, y: y - 2 }, end: { x: M + 80, y: y - 2 }, thickness: 1.2, color: COL_INK });
    y -= 18;

    const kondBox = (titel, body) => {
      if (!body) return;
      const bodyLines = wrap(body, helv, 10, W - 2*M - 24);
      const h = 18 + bodyLines.length * 13 + 8;
      ensureSpace(h + 8);
      page.drawRectangle({ x: M, y: y - h, width: W - 2*M, height: h, color: COL_BG_LIGHT });
      draw(titel, M + 12, y - 14, bold, 10.5, COL_INK);
      let yy = y - 28;
      for (const l of bodyLines) { draw(l, M + 12, yy, helv, 10, COL_INK); yy -= 13; }
      y -= h + 6;
    };
    if (sub.lieferzeitGesamt) kondBox('Lieferzeit', sub.lieferzeitGesamt);
    kondBox('Preisbasis', 'Festpreis, gültig 60 Tage ab Angebotsdatum');
    kondBox('Zahlungsbedingungen', 'Zahlungsziel: 14 Tage netto nach Rechnungsstellung.');
    kondBox('Gewährleistung', '24 Monate auf neu eingebaute Teile gemäß § 634a BGB');

    // Unterschrift-Block
    y -= 10;
    ensureSpace(80);
    page.drawLine({ start: { x: M, y }, end: { x: W - M, y }, thickness: 0.5, color: COL_LIGHT });
    y -= 14;
    draw('VERBINDLICHE BESTÄTIGUNG', M, y, bold, 8.5, COL_MUTE); y -= 16;
    if (sub.sigMode === 'drawn' && sub.signaturDataUrl) {
      try {
        const png = await doc.embedPng(sub.signaturDataUrl);
        const sigW = 180, sigH = 50;
        page.drawImage(png, { x: M, y: y - sigH, width: sigW, height: sigH });
        y -= sigH + 6;
      } catch (_) {}
    } else {
      draw('✓ Digital bestätigt (§ 127 i.V.m. § 126b BGB · Textform)', M, y, helv, 10, COL_INK); y -= 14;
    }
    draw('Unterzeichnet von: ' + (sub.sigName || '—'), M, y, bold, 10, COL_INK); y -= 13;
    draw('Datum: ' + dat, M, y, helv, 10, COL_MUTE);

    // AGB auf neue Seite
    const klauselnText = htmlToText(sub.klauseln);
    if (klauselnText) {
      newPage();
      draw('Allgemeine Geschaeftsbedingungen', M, y, bold, 16, COL_INK); y -= 4;
      page.drawLine({ start: { x: M, y: y - 2 }, end: { x: M + 140, y: y - 2 }, thickness: 1.2, color: COL_INK });
      y -= 22;
      // Render strukturiert (H4 als Bold-Header, P als Body)
      const lines = klauselnText.split('\n');
      for (let i = 0; i < lines.length; i++) {
        const ln = lines[i].trim();
        if (!ln) { y -= 6; continue; }
        // Heuristik: kurze Zeilen ohne Punkt am Ende als Header behandeln
        const isHeader = ln.length < 50 && !/[.,:]$/.test(ln) && /^[A-ZÄÖÜ]/.test(ln);
        if (isHeader) {
          y -= 4;
          ensureSpace(20);
          draw(ln, M, y, bold, 11, COL_INK); y -= 14;
        } else {
          const wr = wrap(ln, helv, 10, W - 2*M);
          for (const l of wr) { ensureSpace(14); draw(l, M, y, helv, 10, COL_INK); y -= 13; }
        }
      }
    }

    // Footer auf jeder Seite (3 Spalten)
    totalPagesHolder.total = allPages.length;
    allPages.forEach((pg, idx) => {
      const fY = 70;
      pg.drawLine({ start: { x: M, y: fY + 32 }, end: { x: W - M, y: fY + 32 }, thickness: 0.5, color: COL_LIGHT });
      const colW = (W - 2*M) / 3;
      const xCol = [M, M + colW, M + 2 * colW];
      const drawCol = (xi, lblTitel, lines) => {
        pg.drawText(safe(lblTitel), { x: xCol[xi], y: fY + 18, size: 9, font: bold, color: COL_INK });
        let yy = fY + 6;
        for (const l of lines) {
          if (!l) continue;
          pg.drawText(safe(l), { x: xCol[xi], y: yy, size: 8.5, font: helv, color: COL_MUTE });
          yy -= 10;
        }
      };
      // Spalte 1: Firma + Anschrift
      drawCol(0, sub.wn.firma || '—', [
        sub.wn.strasse || '',
        [sub.wn.plz, sub.wn.ort].filter(Boolean).join(' '),
      ]);
      // Spalte 2: Kontakt
      drawCol(1, 'Kontakt', [sub.wn.email || '', sub.wn.web || '']);
      // Spalte 3: Rechtliches
      drawCol(2, 'Rechtliches', [
        sub.wn.hrb_nummer ? (sub.wn.hrb_nummer + (sub.wn.hrb_gericht ? ' AG ' + sub.wn.hrb_gericht : '')) : '',
        sub.wn.ust_id ? ('USt-IdNr. ' + sub.wn.ust_id) : '',
        sub.wn.geschaeftsfuehrer ? ('GF: ' + sub.wn.geschaeftsfuehrer) : '',
      ]);
      // Seitenzahl rechts unten
      const pn = 'Angebot ' + angNr + ' - Seite ' + (idx + 1) + ' / ' + totalPagesHolder.total;
      const pnW = helv.widthOfTextAtSize(safe(pn), 8);
      pg.drawText(safe(pn), { x: W - M - pnW, y: 36, size: 8, font: helv, color: COL_MUTE });
    });

    const bytes = await doc.save();
    return new Blob([bytes], { type: 'application/pdf' });
  }

  // Start
  load().catch(e => { console.error(e); renderError('Unerwarteter Fehler: ' + e.message); });
})();
</script>
</body>
